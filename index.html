<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partitura Inteligente — o nome de cada nota no seu PDF</title>
<meta name="description" content="Solte o PDF da partitura e receba o mesmo arquivo com o nome de cada nota embaixo da pauta, mais a análise da música: tom, harmonia, ritmo e harmonia.">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 19'%3E%3Cg stroke='%2382a4f5' stroke-width='1' opacity='.45' fill='none'%3E%3Cpath d='M0 2.5h26M0 6.5h26M0 10.5h26M0 14.5h26M0 18.5h26'/%3E%3C/g%3E%3Cellipse cx='8' cy='12.5' rx='4.6' ry='3.4' fill='%2382a4f5' transform='rotate(-18 8 12.5)'/%3E%3Cpath d='M12.2 12V2' stroke='%2382a4f5' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
  /* ================================================================ fontes
     Fraunces (SIL OFL) hospedada aqui mesmo — o site roda offline depois do
     primeiro carregamento, e uma chamada a CDN de fonte seria a unica
     dependencia de rede fora do Pyodide. Fonte variavel: um arquivo cobre
     todos os pesos. Caminho RELATIVO: o site vive em /anotar-partitura/,
     entao "/fonts/..." apontaria para a raiz do dominio, que nao existe. */
  @font-face {
    font-family: "Fraunces";
    font-style: normal;
    font-weight: 300 900;
    font-display: swap;
    src: url("fonts/fraunces-variable.woff2") format("woff2");
  }

  /* ================================================================ tokens
     ESCURO E O PADRAO. O tema claro entra por cima, como excecao — e o
     contrario do que era antes, e e de proposito: a partitura anotada e uma
     folha branca grande, e ela rende mais sobre fundo escuro do que sobre
     fundo claro, onde a pagina toda vira uma mancha branca so.

     Superficie em quatro degraus (fundo -> cartao -> cartao interno ->
     campo). No escuro cada degrau e um cinza-azulado um passo mais claro,
     com um fio de luz no topo (--brilho): sombra preta sobre preto nao
     aparece. No claro e a sombra que separa, e o degrau quase nao muda.

     Tipografia em duas familias: Fraunces (serifada, com eixo optico) para
     titulo e numero grande — e o que da CARA ao site; sans do sistema para
     o resto, que e texto de interface e tem de sumir. */
  :root {
    --t-xl: 2.125rem; --t-lg: 1.125rem; --t-md: 1rem; --t-sm: .875rem; --t-xs: .75rem;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;

    --fonte-exibicao: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
    --fonte-texto: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* superficies */
    --bg: #0b0c10;  --sup: #14161d;  --sup2: #191c25;  --sup3: #1f232e;
    --borda: #242833; --borda-forte: #343a49;
    --texto: #eceef4; --texto-2: #99a0b2; --texto-3: #6d7488;

    /* acentos — os mesmos seis do Diario de Foco */
    --acento: #82a4f5; --acento-rgb: 130, 164, 245;
    --acento-texto: #0a0e1a;
    --acento-fraco: rgba(130, 164, 245, .13);
    --ok: #63c890; --erro: #ec8a7c; --atencao: #ddb45c;
    --violeta: #b79bf0; --rosa: #f09ab4; --ciano: #5cc4cf;

    /* elevacao */
    --sombra-1: 0 1px 2px rgba(0, 0, 0, .45);
    --sombra: 0 6px 20px -8px rgba(0, 0, 0, .6);
    --sombra-3: 0 22px 48px -16px rgba(0, 0, 0, .75);
    --brilho: inset 0 1px 0 rgba(255, 255, 255, .05);
    --anel: 0 0 0 2px var(--bg), 0 0 0 4px rgba(var(--acento-rgb), .55);

    /* motivo de pauta atras do titulo, e o quanto o fundo brilha */
    --pauta: rgba(236, 238, 244, .085);
    --aurora: .38; --grao: .05; --grao-mix: overlay;
    --halo: 0 1px 14px rgba(6, 6, 10, .6);

    color-scheme: dark;
  }

  /* claro: mesma arquitetura, papel no lugar do estudio. O acento escurece
     porque #82a4f5 sobre branco nao passa em contraste de texto. */
  :root[data-theme="light"] {
    --bg: #f2f3f7;  --sup: #fff;  --sup2: #f6f7fa;  --sup3: #eceef4;
    --borda: #e1e4ed; --borda-forte: #c5cad8;
    --texto: #15171e; --texto-2: #545b6d; --texto-3: #7c8396;

    --acento: #3253c4; --acento-rgb: 50, 83, 196;
    --acento-texto: #fff;
    --acento-fraco: rgba(50, 83, 196, .09);
    --ok: #0f7a50; --erro: #bd3524; --atencao: #8a640d;
    --violeta: #6446bd; --rosa: #b83f74; --ciano: #14707d;

    --sombra-1: 0 1px 2px rgba(19, 22, 34, .06);
    --sombra: 0 1px 2px rgba(19, 22, 34, .05), 0 10px 26px -12px rgba(19, 22, 34, .22);
    --sombra-3: 0 24px 60px -22px rgba(19, 22, 34, .3);
    --brilho: none;
    --pauta: rgba(21, 23, 30, .1);
    --aurora: .34; --grao: .035; --grao-mix: multiply;
    --halo: 0 1px 10px rgba(255, 255, 255, .8);

    color-scheme: light;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ============================================================ fundo
     Duas camadas fixas, as duas PARADAS. Antes havia um fundo psicodelico
     girando; ele disputava atencao com o proprio resultado e mantinha o
     compositor repintando enquanto o Pyodide precisava da maquina. Agora e
     luz difusa: tres manchas frias, mascaradas no centro para nao roubar
     contraste de onde a partitura e lida, e um grao fino por cima. */
  body::before, body::after {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  }
  body::before {
    background:
      radial-gradient(58% 44% at 14% -6%, rgba(var(--acento-rgb), .9) 0%, transparent 62%),
      radial-gradient(50% 40% at 92% 6%, #b79bf0 0%, transparent 64%),
      radial-gradient(58% 40% at 76% 108%, #5cc4cf 0%, transparent 58%);
    opacity: var(--aurora);
    -webkit-mask-image: radial-gradient(46% 34% at 50% 46%, transparent 0%, #000 88%);
            mask-image: radial-gradient(46% 34% at 50% 46%, transparent 0%, #000 88%);
  }
  /* grao monocromatico de uma oitava — decimo do custo do fractal colorido
     que estava aqui, e e ele que tira o ar de gradiente de PowerPoint */
  body::after {
    z-index: -1;
    background: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.8%27%20numOctaves%3D%271%27%20stitchTiles%3D%27stitch%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27180%27%20height%3D%27180%27%20filter%3D%27url%28%23g%29%27%2F%3E%3C%2Fsvg%3E") repeat;
    background-size: 180px 180px;
    mix-blend-mode: var(--grao-mix);
    opacity: var(--grao);
  }
  /* no celular fica so a luz: o grao e uma camada de blend em tela cheia, e
     memoria de compositor conta no mesmo orcamento do Pyodide */
  @media (max-width: 760px), (pointer: coarse) {
    body::after { display: none; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: var(--t-md)/1.55 var(--fonte-texto);
    -webkit-font-smoothing: antialiased;
  }
  .pagina { max-width: 820px; margin: 0 auto; padding: var(--s7) var(--s5) 96px; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: var(--r-sm); }
  ::selection { background: rgba(var(--acento-rgb), .28); }

  h1, h2, h3 { font-family: var(--fonte-exibicao); }
  h1 { font-size: var(--t-xl); line-height: 1.05; letter-spacing: -.02em; margin: 0 0 var(--s3);
       font-weight: 600; }
  h2 { font-size: var(--t-lg); line-height: 1.3; letter-spacing: -.01em; margin: 0 0 var(--s3);
       font-weight: 600; }
  p  { margin: 0 0 var(--s4); }
  .apoio { color: var(--texto-2); max-width: 56ch; }
  .meta  { color: var(--texto-3); font-size: var(--t-sm); }

  /* =========================================================== marca
     A identidade e o proprio assunto: cinco linhas de pauta atras do nome.
     Sem imagem — gradiente repetido, apagado em todas as direcoes, senao
     vira um punhado de rebarbas atravessando a pagina e parece defeito. */
  header { position: relative; margin-bottom: var(--s6); }
  header::before {
    content: ""; position: absolute; inset: -22px -14px auto -14px; height: 150px;
    background: repeating-linear-gradient(to bottom,
      transparent 0 13px, var(--pauta) 13px 14px, transparent 14px 27px);
    -webkit-mask-image: radial-gradient(120% 105% at 13% 6%, #000 0%,
                        rgba(0,0,0,.42) 40%, transparent 74%);
            mask-image: radial-gradient(120% 105% at 13% 6%, #000 0%,
                        rgba(0,0,0,.42) 40%, transparent 74%);
    pointer-events: none; z-index: 0;
  }
  header > * { position: relative; z-index: 1; }
  /* O nome e o titulo da pagina, nao uma etiqueta: cresce com a largura e
     para antes de encostar na borda. Duas palavras longas — pode quebrar. */
  .marca { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
           margin: 0 0 var(--s2); font-size: clamp(2.1rem, 6.6vw, 3.15rem);
           font-weight: 600; letter-spacing: -.022em; line-height: 1.02; }
  .marca svg { display: block; color: var(--acento); flex: none; }
  /* segunda palavra no acento: e o que separa esta ferramenta de "mais um
     anotador de PDF" — a analise. <em> em vez de classe: zero risco de
     colidir com nome ja usado no arquivo. */
  .marca em { font-style: normal; color: var(--acento); }
  header .marca, header .sub-app, header .beta { text-shadow: var(--halo, none); }
  .sub-app { font-size: var(--t-lg); color: var(--texto-2); font-weight: 400;
             margin: 0 0 var(--s3); max-width: 54ch; }
  /* inline-BLOCK, nao inline-flex: como flex, cada <b> vira item e o navegador
     come o espaco entre eles — o texto saia "com PDF . Com print de tela ." */
  .beta { font-size: var(--t-sm); color: var(--texto-3); margin: 0;
          display: inline-block; max-width: 100%;
          padding: 5px var(--s4); border: 1px solid var(--borda);
          border-radius: 999px; background: var(--sup); box-shadow: var(--sombra-1); }
  .beta b { color: var(--texto-2); font-weight: 600; }

  /* =========================================================== tema
     Fora do fluxo, no canto: e controle de ambiente, nao passo da tarefa. */
  .btn-tema { position: fixed; top: 14px; right: 14px; z-index: 30;
              width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
              border-radius: 50%; cursor: pointer; color: var(--texto-2);
              background: var(--sup); border: 1px solid var(--borda);
              box-shadow: var(--sombra-1), var(--brilho);
              transition: color .15s ease, border-color .15s ease; }
  .btn-tema:hover { color: var(--texto); border-color: var(--borda-forte); }
  .btn-tema svg { display: block; }
  .btn-tema .ic-sol { display: block; }
  .btn-tema .ic-lua { display: none; }
  :root[data-theme="light"] .btn-tema .ic-sol { display: none; }
  :root[data-theme="light"] .btn-tema .ic-lua { display: block; }

  /* =========================================================== painel  */
  .painel { background: linear-gradient(180deg, var(--sup2), var(--sup) 62%);
            border: 1px solid var(--borda);
            border-radius: var(--r-lg); box-shadow: var(--sombra), var(--brilho);
            overflow: hidden; }
  #zona {
    border: 0; border-bottom: 1px solid var(--borda); background: transparent;
    padding: var(--s7) var(--s5); text-align: center; cursor: pointer;
    display: block; width: 100%; font: inherit; color: inherit; position: relative;
    transition: background .15s ease;
  }
  /* a moldura tracejada e um filho, nao a borda do botao: assim ela some no
     hover sem mexer no tamanho da caixa nem empurrar o conteudo 1px */
  #zona::before {
    content: ""; position: absolute; inset: var(--s3);
    border: 1.5px dashed var(--borda-forte); border-radius: var(--r-md);
    pointer-events: none; transition: border-color .15s ease, background .15s ease;
  }
  #zona:hover { background: rgba(var(--acento-rgb), .05); }
  #zona:hover::before { border-color: rgba(var(--acento-rgb), .55); }
  #zona.sobre { background: var(--acento-fraco); }
  #zona.sobre::before { border-color: var(--acento); border-style: solid; }
  #zona .titulo { font-family: var(--fonte-exibicao); font-size: 1.32rem; font-weight: 600;
                  letter-spacing: -.012em; display: block; margin-bottom: var(--s1); }
  #zona .sub { color: var(--texto-3); font-size: var(--t-sm); }
  #zona .alvo {
    width: 52px; height: 52px; margin: 0 auto var(--s4); border-radius: 50%;
    display: grid; place-items: center; color: var(--acento);
    background: var(--acento-fraco); box-shadow: inset 0 0 0 1px rgba(var(--acento-rgb), .22);
    transition: transform .16s ease;
  }
  #zona:hover .alvo, #zona.sobre .alvo { transform: translateY(-3px); }
  #arquivo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* =========================================================== opcoes  */
  .opcoes {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5);
    padding: var(--s3) var(--s4); background: var(--bg);
    border-top: 1px solid var(--borda);
    font-size: var(--t-sm); color: var(--texto-2);
  }
  .grupo { display: inline-flex; align-items: center; gap: var(--s3); }
  .segmento { display: inline-flex; background: var(--sup3); border-radius: 999px; padding: 3px;
              border: 1px solid var(--borda); }
  .segmento label {
    padding: 5px var(--s4); border-radius: 999px; cursor: pointer; color: var(--texto-2);
    transition: background .12s ease, color .12s ease; white-space: nowrap;
  }
  .segmento input { position: absolute; opacity: 0; width: 0; height: 0; }
  .segmento input:checked + span { color: var(--acento-texto); font-weight: 600; }
  .segmento label:has(input:checked) { background: var(--acento); box-shadow: var(--sombra-1); }
  .segmento label:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }

  /* ========================================================= progresso */
  #barra { margin-top: var(--s4); display: none; }
  #barra.on { display: block; }
  #barra .rotulo { display: flex; justify-content: space-between; font-size: var(--t-sm);
                   color: var(--texto-2); margin-bottom: var(--s2); gap: var(--s3); }
  #barra .trilho { height: 6px; background: var(--sup3); border-radius: 99px; overflow: hidden;
                   border: 1px solid var(--borda); }
  #barra .cheio { height: 100%; width: 0%; border-radius: 99px;
                  background: linear-gradient(90deg, var(--acento), var(--violeta));
                  transition: width .25s ease; }
  #barra.indeterminado .cheio { width: 35%; animation: correr 1.2s ease-in-out infinite; }
  @keyframes correr { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  /* ============================================================ lista
     Cada arquivo e um cartao com um filete de acento na lateral esquerda —
     e o que amarra este site ao Diario de Foco. O filete tem cor propria
     (--acc) quando o assunto pede. */
  #lista { margin-top: var(--s5); display: grid; gap: var(--s5); }
  .cartao {
    --acc: var(--acento);
    position: relative;
    background: linear-gradient(180deg, var(--sup2), var(--sup) 62%);
    border: 1px solid var(--borda);
    border-radius: var(--r-lg); box-shadow: var(--sombra), var(--brilho);
    overflow: hidden;
  }
  .cartao::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: linear-gradient(180deg, var(--acc), rgba(var(--acento-rgb), 0));
    border-radius: var(--r-lg) 0 0 var(--r-lg);
  }
  .cartao::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 90px; pointer-events: none;
    background: linear-gradient(90deg, rgba(var(--acento-rgb), .07), transparent);
  }
  .cartao > * { position: relative; }

  .topo { display: flex; align-items: center; gap: var(--s4); padding: var(--s4) var(--s5); }
  .ident { min-width: 0; flex: 1; }
  .ident .nome { font-weight: 600; overflow-wrap: anywhere; line-height: 1.35; }
  .ident .estado { font-size: var(--t-sm); color: var(--texto-2); margin-top: 2px; }
  .ident .estado.bom { color: var(--ok); }
  .ident .estado.ruim { color: var(--erro); }
  .ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--borda-forte); }
  .ponto.trabalhando { background: var(--acento); animation: pulsa 1s ease-in-out infinite;
                       box-shadow: 0 0 0 4px rgba(var(--acento-rgb), .18); }
  .ponto.bom { background: var(--ok); }
  .ponto.ruim { background: var(--erro); }
  @keyframes pulsa { 50% { opacity: .35; } }

  /* =========================================================== botoes  */
  .btn {
    font: inherit; font-size: var(--t-sm); font-weight: 600; border-radius: var(--r-sm);
    padding: 10px var(--s4); cursor: pointer; white-space: nowrap; text-decoration: none;
    border: 1px solid transparent; flex: none; display: inline-flex; align-items: center;
    gap: var(--s2); justify-content: center;
    transition: background .12s ease, color .12s ease, filter .12s ease, transform .12s ease;
  }
  .btn-primario { background: linear-gradient(180deg,
                    color-mix(in oklab, var(--acento) 88%, #fff),
                    var(--acento));
                  color: var(--acento-texto);
                  box-shadow: inset 0 1px 0 rgba(255,255,255,.28),
                              0 6px 16px -8px rgba(var(--acento-rgb), .85); }
  .btn-primario:hover { filter: brightness(1.07); }
  .btn-primario:active { transform: translateY(1px); filter: brightness(.97); }
  .btn-secundario { background: var(--sup3); color: var(--texto-2); border-color: var(--borda); }
  .btn-secundario:hover { background: var(--sup2); color: var(--texto);
                          border-color: var(--borda-forte); }

  /* =========================================================== analise */
  .analise { border-top: 1px solid var(--borda); background: var(--bg); }
  .tit-analise { font-family: var(--fonte-texto); font-size: 11px; font-weight: 600;
                 color: var(--texto-3); text-transform: uppercase; letter-spacing: .09em;
                 padding: var(--s5) var(--s5) 0; margin: 0; }
  .analise > summary {
    padding: var(--s3) var(--s5); cursor: pointer; font-size: var(--t-sm);
    color: var(--texto-2); list-style: none; display: flex; align-items: center; gap: var(--s2);
  }
  .analise > summary::-webkit-details-marker { display: none; }
  .analise > summary::before { content: "▸"; font-size: .7em; transition: transform .15s ease; }
  .analise[open] > summary::before { transform: rotate(90deg); }
  .analise > summary:hover { color: var(--texto); }

  /* Duas colunas a partir de 640px: em coluna unica a analise virava uma
     fita sem fim, e o olho nao tinha onde parar. */
  /* minmax(0, 1fr), nao 1fr: a coluna de grid tem minimo AUTO, entao a barra da
     previa (botoes com flex:none) empurrava a coluna alem da largura do cartao e a
     partitura saia cortada no celular. */
  .corpo { padding: var(--s4) var(--s5) var(--s5); display: grid; gap: var(--s3);
           grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 640px) { .corpo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .corpo > .larga { grid-column: 1 / -1; }

  .bloco { --acc: var(--borda-forte);
           position: relative; overflow: hidden;
           background: var(--sup); border: 1px solid var(--borda);
           border-radius: var(--r-md); padding: var(--s4) var(--s4) var(--s4) var(--s5);
           box-shadow: var(--sombra-1), var(--brilho); }
  .bloco::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: linear-gradient(180deg, var(--acc), transparent);
  }
  .bloco > * { position: relative; }
  .bloco h3 { font-family: var(--fonte-texto); font-size: 11px; font-weight: 600;
              color: var(--texto-3); text-transform: uppercase; letter-spacing: .09em;
              margin: 0 0 var(--s3); }
  /* o filete ganha cor so quando o assunto tem cor — o resto fica neutro,
     senao a analise inteira vira arco-iris e a cor deixa de significar algo */
  .acc-violeta { --acc: var(--violeta); }
  .acc-ciano   { --acc: var(--ciano); }
  .acc-rosa    { --acc: var(--rosa); }
  .acc-verde   { --acc: var(--ok); }
  .acc-azul    { --acc: var(--acento); }

  .fatos { display: grid; grid-template-columns: repeat(auto-fit, minmax(102px, 1fr));
           gap: var(--s2); margin: 0; }
  .fato { background: var(--sup); border: 1px solid var(--borda);
          border-radius: var(--r-sm); padding: var(--s2) var(--s3);
          box-shadow: var(--brilho); }
  .fato dt { font-size: var(--t-xs); color: var(--texto-3); text-transform: uppercase;
             letter-spacing: .07em; margin-bottom: 2px; }

  .vozes { display: flex; gap: var(--s2); margin-top: var(--s3); }

  /* =========================================================== player  */
  .tocador { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .transporte { display: flex; align-items: center; gap: var(--s1); }
  .icone {
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center;

  .icone:hover { background: var(--sup3); color: var(--texto); border-color: var(--borda-forte); }
  .icone.play { width: 44px; height: 44px; border-color: transparent;
                color: var(--acento-texto);
                background: linear-gradient(180deg,
                  color-mix(in oklab, var(--acento) 88%, #fff), var(--acento));

  .icone.play:hover { filter: brightness(1.07); }
  .icone svg { display: block; }
  /* o atributo hidden do HTML nao vale dentro de SVG — tem de ser CSS */
  .icone.play .ic-pause { display: none; }
  .icone.play.rodando .ic-play { display: none; }
  .icone.play.rodando .ic-pause { display: inline; }
  .relogio { font-size: var(--t-xs); color: var(--texto-3);
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linha { flex: 1 1 120px; min-width: 100px; height: 20px; margin: 0;
           -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  .linha::-webkit-slider-runnable-track {
    height: 6px; border-radius: 99px; background: var(--trilho, var(--sup3)); }
  .linha::-moz-range-track {
    height: 6px; border-radius: 99px; background: var(--trilho, var(--sup3)); }
  .linha::-webkit-slider-thumb {

    border-radius: 50%; background: var(--acento); border: 0;
    box-shadow: 0 0 0 3px rgba(var(--acento-rgb), .2); }
  .linha::-moz-range-thumb {

    box-shadow: 0 0 0 3px rgba(var(--acento-rgb), .2); }
  .and { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3);
         font-size: var(--t-xs); color: var(--texto-3); }
  .and input[type=range] { width: 108px; accent-color: var(--acento); }
  .and .bpm { font-variant-numeric: tabular-nums; min-width: 4.4em; }

  /* =========================================================== editor
     A previa vem SEM os nomes e os nomes sao um SVG por cima, em unidades de
     PONTO da pagina. Assim o overlay escala junto com a imagem sem nenhuma

  /* o .corpo e um grid: sem isso o palco e a dica virariam duas COLUNAS e a

  .palco, .dica-editor, .barra-previa { grid-column: 1 / -1; }

  /* A pagina tem 820px para o texto ficar legivel, mas o RESULTADO quer todo
     o espaco que houver: a lista de cartoes escapa do container e se centra

  #lista.largo { width: min(1320px, calc(100vw - 2.5rem));
                 margin-left: 50%; transform: translateX(-50%); }
  /* abaixo disso a faixa larga sairia MENOR que a coluna normal */
  @media (max-width: 900px) {

  .palco { position: relative; display: block; border-radius: var(--r-md);

  .barra-previa { display: flex; align-items: center; gap: var(--s3);

  .paginacao { display: flex; align-items: center; gap: var(--s2);
               font-size: var(--t-sm); font-weight: 600; color: var(--texto); }
  .paginacao button { width: 44px; height: 44px; padding: 0; display: grid;
                      place-items: center; font-size: 1.5rem; line-height: 1;
                      border-radius: var(--r-md); border: 1px solid var(--borda-forte);
                      background: var(--sup2); color: var(--texto); cursor: pointer; }
  .paginacao button:hover:not([disabled]) { background: var(--acento-fraco);
                                            border-color: var(--acento); }
  .paginacao [data-conta] { min-width: 8.5ch; text-align: center;
                            font-variant-numeric: tabular-nums; }
  .paginacao button[disabled] { opacity: .3; cursor: default; }
  .btn-mini { padding: .35rem .7rem; font: inherit; font-size: var(--t-xs); font-weight: 600;
              border-radius: 999px; background: var(--sup2); color: var(--texto-2);

              transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .btn-mini:hover { background: var(--sup3); color: var(--texto); border-color: var(--borda-forte); }

  /* Ampliado maximiza a LARGURA e rola na vertical. Limitar pela altura da
     tela era pior que nao ampliar: a pagina e retrato, a tela e paisagem, e a
     partitura saia mais estreita do que no tamanho normal. */
  .lupa { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center;
          align-items: start; padding: var(--s2) var(--s2) var(--s7);
          overflow: auto; background: var(--bg); }
  .lupa .palco { width: fit-content; max-width: none; border-radius: var(--r-sm); }
  .lupa .palco > img { width: min(1900px, calc(100vw - 2 * var(--s2))); height: auto; }
  .lupa-fechar { position: fixed; top: var(--s3); right: var(--s3); z-index: 61; }
  /* PRETO fixo, nao currentColor: o fundo aqui e a partitura branca, e o tema
     escuro herdava cinza-claro — os nomes ficavam ilegiveis. Preto tambem e o
     que o PDF estampa, entao o overlay mostra o resultado de verdade. */
  .palco svg text { fill: #111; font-family: Helvetica, Arial, sans-serif;
                    pointer-events: none; }
  /* ALVO DE TOQUE: o nome tem ~8pt de altura, alvo pequeno demais para o dedo.
     Quem recebe o clique e um retangulo invisivel bem maior em volta. */
  .palco svg .toque { fill: transparent; cursor: pointer; }
  .palco svg .toque:hover + text { fill: #3253c4; }
  .palco svg g.sel text { fill: #3253c4; font-weight: 700; }
  .palco svg g.sel .toque { fill: rgba(50,83,196,.12); }
  .palco.pondo { cursor: crosshair; }

  /* ================================================== seguidor de execucao
     A barra que anda por cima da partitura enquanto a musica toca. Mora num SVG
     PROPRIO, irmao do svg do editor, por duas razoes: `redesenhar()` esvazia o svg do
     editor inteiro e levaria a barra junto, e sem `pointer-events: none` a camada de
     cima roubaria todo clique de corrigir nome.
     LARANJA fixo, pelo mesmo motivo do preto dos nomes: o fundo aqui e a partitura
     branca, entao a cor tem de contrastar com o PAPEL, nao com o tema da pagina. */
  .palco svg.seguidor { pointer-events: none; }
  .seguidor .agulha { stroke: #f76707; stroke-width: 2; stroke-linecap: round;
                      opacity: .88; }

  /* Transporte preso na base da tela. A partitura fica no alto da pagina e o player la
     embaixo, no bloco de analise: sem isto nao da para ver a barra andando e apertar
     play ao mesmo tempo. z-index acima da lupa (60), para valer tambem no ampliado. */
  .rodape-toca { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
                 display: flex; align-items: center; gap: var(--s3);
                 padding: var(--s2) var(--s4);
                 padding-bottom: calc(var(--s2) + env(safe-area-inset-bottom, 0px));
                 background: var(--sup); border-top: 1px solid var(--borda);
                 box-shadow: 0 -10px 30px -14px rgba(0,0,0,.5); }
  .rodape-toca .linha { flex: 1 1 auto; }
  .rodape-toca .sai-rodape { flex: none; }
  @media (max-width: 480px) {
    .rodape-toca { gap: var(--s2); padding-left: var(--s3); padding-right: var(--s3); }
    .rodape-toca .fim { display: none; }
  }
  .paleta { position: absolute; z-index: 6; display: flex; flex-wrap: wrap; gap: 3px;
            width: 13rem; padding: var(--s1); border-radius: var(--r-sm);
            background: var(--sup); border: 1px solid var(--borda-forte);
            box-shadow: var(--sombra-3); }
  .paleta button { padding: .2rem .4rem; font: inherit; font-size: var(--t-xs); line-height: 1.1;
                   min-width: 1.7rem; border-radius: 6px; cursor: pointer;
                   background: var(--sup2); color: var(--texto);
                   border: 1px solid var(--borda); }
  .paleta button:hover { background: var(--acento); color: var(--acento-texto);

  .paleta .zap { margin-left: auto; color: var(--erro); }
  .campo { position: absolute; z-index: 5; width: 5.2rem; padding: .25rem .35rem;
           font: inherit; font-size: var(--t-xs); text-align: center;
           background: var(--sup); color: var(--texto);
           border: 1px solid var(--acento); border-radius: var(--r-sm);
           box-shadow: 0 0 0 3px rgba(var(--acento-rgb), .18); }
  .dica-editor { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
                 margin-top: var(--s3); font-size: var(--t-xs); color: var(--texto-3); }
  .dica-editor .chip { padding: .15rem .5rem; border: 1px solid var(--borda);
                       border-radius: 999px; background: var(--sup2); color: var(--texto-2); }
  .previa img { width: 100%; border: 1px solid var(--borda); border-radius: var(--r-sm);
                background: #fff; display: block; }
  .previa { padding: 0 var(--s5) var(--s5); }

  /* -------------------------------------------------- conversa sobre a musica */

  /* ============================================================ dicas
     Um balao so, position:fixed e preso no body. Dentro do cartao ele seria
     cortado pelo overflow:hidden, e z-index nao resolveria isso. */
  .tem-dica { cursor: help; }
  .bloco h3.tem-dica, .tem-dica dt {
    text-decoration: underline dotted; text-decoration-color: var(--borda-forte);
    text-underline-offset: 3px;
  }
  .bloco h3.tem-dica:hover, .tem-dica:hover dt { text-decoration-color: var(--texto-3); }
  .dica {
    position: fixed; z-index: 90; left: 0; top: 0;
    max-width: min(330px, calc(100vw - 24px));
    background: var(--sup2); color: var(--texto);
    border: 1px solid var(--borda-forte); border-radius: var(--r-md);
    padding: var(--s3) var(--s4); font-size: var(--t-sm); line-height: 1.45;
    box-shadow: var(--sombra-3);
    opacity: 0; visibility: hidden; transform: translateY(3px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s;
    pointer-events: none;
  }
  .dica.on { opacity: 1; visibility: visible; transform: none; }
  .dica p { margin: 0 0 var(--s2); }
  .dica p:last-child, .dica ul:last-child { margin-bottom: 0; }
  .dica ul { margin: 0 0 var(--s2); padding-left: 1.05em; }
  .dica li { margin-bottom: 2px; }
  .dica b { font-weight: 600; color: var(--texto); }

  /* ============================================================== fim   */
  .nota-rodape { margin-top: var(--s6); color: var(--texto-3); font-size: var(--t-sm); }
  .cartao > .nota-rodape { margin: 0; padding: var(--s3) var(--s5) var(--s4);
                           background: var(--bg); }
  footer { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--borda);
           color: var(--texto-3); font-size: var(--t-sm); }
  footer a { color: var(--acento); }
  @media (max-width: 560px) {
    .pagina { padding: var(--s5) var(--s4) 72px; }
    :root { --t-xl: 1.75rem; }
    .topo { flex-wrap: wrap; padding: var(--s4); }

  }
</style>
<script>
  // roda antes do corpo existir: tema salvo manda, senao vale o do sistema

<body>
<button type="button" class="btn-tema" id="tema" aria-label="Alternar tema claro e escuro"

<script type="module">
const $ = (s) => document.querySelector(s);
const btTema = $("#tema");
btTema.addEventListener("click", () => {
  const novo = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem("tema", novo); } catch (e) {}
});

const zona = $("#zona"), entrada = $("#arquivo"), lista = $("#lista");
const barra = $("#barra"), barraTxt = $("#barra-txt"), barraNum = $("#barra-num"),
      barraCheio = $("#barra-cheio");
const MAX_MB = 40;

// ---------------------------------------------------------------- dicas
// Balao unico reaproveitado. Aparece no hover, no foco pelo teclado e no toque;
// some com Esc, ao rolar a pagina e ao tocar em qualquer outro lugar.
const DICA = document.createElement("div");
DICA.className = "dica";
DICA.id = "dica";
DICA.setAttribute("role", "tooltip");
document.body.append(DICA);
let alvoDica = null, ultimoPonteiro = "mouse";
const trecho = (html) => document.createRange().createContextualFragment(html);

function mostrarDica(el) {
  if (!el._dica) return;
  DICA.replaceChildren(el._dica.cloneNode(true));
  DICA.classList.add("on");
  const a = el.getBoundingClientRect(), d = DICA.getBoundingClientRect();
  const x = Math.max(8, Math.min(a.left + a.width / 2 - d.width / 2, innerWidth - d.width - 8));
  const acima = a.top - d.height - 8;
  DICA.style.left = x + "px";
  DICA.style.top = (acima >= 8 ? acima : a.bottom + 8) + "px";
  el.setAttribute("aria-describedby", "dica");
  alvoDica = el;
}

function esconderDica() {
  DICA.classList.remove("on");
  alvoDica?.removeAttribute("aria-describedby");
  alvoDica = null;
}

function comDica(el, conteudo) {
  if (!el) return el;
  el._dica = typeof conteudo === "string" ? document.createTextNode(conteudo) : conteudo;
  el.classList.add("tem-dica");
  if (el.tabIndex < 0) el.tabIndex = 0;
  el.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && mostrarDica(el));
  el.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && esconderDica());
  el.addEventListener("focus", () => mostrarDica(el));
  el.addEventListener("blur", esconderDica);
  el.addEventListener("click", () => {
    if (ultimoPonteiro === "mouse") return;      // no mouse o hover ja resolveu
    alvoDica === el ? esconderDica() : mostrarDica(el);
  });
  return el;
}
addEventListener("pointerdown", (e) => {
  ultimoPonteiro = e.pointerType || "mouse";
  if (alvoDica && !alvoDica.contains(e.target)) esconderDica();
}, true);

// ---- piano sintetizado no Web Audio: sem sample, sem rede, funciona offline.
// A cor de piano vem de tres coisas: parciais com amplitude decrescente, um filtro
// que fecha enquanto a nota morre (a corda perde brilho antes de perder volume) e
// um estalo curtinho de ruido no ataque, que e o martelo.
let ctxAudio = null, ondaSax = null, bufSopro = null, saidaAudio = null;
function audio() {
  if (ctxAudio) return ctxAudio;
  ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  saidaAudio = ctxAudio.createGain();
  saidaAudio.connect(ctxAudio.destination);
  // TIMBRE DE SAX ALTO. O sax e um tubo CONICO com palheta: soam todos os harmonicos
  // (diferente da clarineta, cilindrica, que enfatiza os impares), com 2o e 3o fortes — e
  // dai vem o corpo "encorpado" dele. Aqui isso e uma PeriodicWave; a parte imaginaria
  // espalha as fases, senao a onda fica com um pico duro e soa eletronica.
  const re = [0, 1, .72, .56, .36, .26, .175, .12, .085, .06, .042, .03, .021, .015, .011];
  const im = re.map((a, k) => k % 2 ? a * 0.35 : -a * 0.22);
  ondaSax = ctxAudio.createPeriodicWave(Float32Array.from(re), Float32Array.from(im),
                                       { disableNormalization: false });
  // ruido de SOPRO: 1,5 s em loop. Existe no ataque (o "ch" da palheta pegando) e continua
  // baixinho no sustain, que e o que faz soar soprado em vez de sintetizado.
  bufSopro = ctxAudio.createBuffer(1, Math.floor(ctxAudio.sampleRate * 1.5), ctxAudio.sampleRate);
  const d = bufSopro.getChannelData(0);
  let m = 0;
  for (let i = 0; i < d.length; i++) {          // ruido levemente rosa: menos assobio
    m = 0.82 * m + 0.18 * (Math.random() * 2 - 1);
    d[i] = m * 2.2;
  }
  return ctxAudio;
}

function tocarNota(midi, quando, segundos) {
  const c = audio(), f = 440 * Math.pow(2, (midi - 69) / 12);
  // Sax NAO tem cauda de ressonancia como piano: enquanto sopra soa, quando para cala.
  // Entao a nota dura o que tem de durar, com um release curto.
  const dur = Math.max(segundos, 0.12);
  const rel = 0.085;
  const fim = quando + dur + rel;

  const vol = c.createGain();
  // ataque de PALHETA: ~45 ms, com um leve pico antes de assentar no sustain. Ataque
  // instantaneo soa a orgao; lento demais soa a flauta.
  vol.gain.setValueAtTime(0.0001, quando);
  vol.gain.exponentialRampToValueAtTime(0.26, quando + 0.045);
  vol.gain.exponentialRampToValueAtTime(0.195, quando + Math.min(0.16, dur * 0.5));
  vol.gain.setValueAtTime(0.195, Math.max(quando + 0.05, quando + dur - 0.01));
  vol.gain.exponentialRampToValueAtTime(0.0001, fim);

  const filtro = c.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.Q.value = 1.4;
  // o brilho ENTRA junto com o ar, nao comeca aberto: cutoff sobe no ataque e recua no fim
  // Os limites tem PISO ABSOLUTO, nao so multiplo da nota: com cutoff puramente relativo
  // (f*8) o corte caia sobre o 7o harmonico de um la 440 e o timbre perdia o brilho — medi
  // h7=0,06 e h8=0,02, quando o sax real ainda tem energia ali. Sax alto vive de 3 a 5 kHz.
  filtro.frequency.setValueAtTime(Math.max(800, f * 2.4), quando);
  filtro.frequency.linearRampToValueAtTime(Math.min(11000, Math.max(4600, f * 11)), quando + 0.07);
  filtro.frequency.linearRampToValueAtTime(Math.min(9000, Math.max(3200, f * 7.5)), quando + dur);
  filtro.frequency.linearRampToValueAtTime(Math.max(900, f * 3), fim);

  // FORMANTES: dois picos fixos (~700 Hz e ~1650 Hz) somados por cima. E o que da o
  // caracter meio nasal, meio vocal do sax — sem eles o timbre fica generico.
  const mistura = c.createGain();
  mistura.connect(vol).connect(saidaAudio);
  filtro.connect(mistura);
  // O de 700 Hz vai em 0,42 e nao 0,5: com 0,5 ele cai em cima do 3o harmonico de um la
  // grave (660 Hz) e deixava o harmonico mais forte que a fundamental — encorpado virava oco.
  for (const [hz, q, g] of [[700, 3.0, 0.42], [1650, 4.0, 0.34]]) {
    const bp = c.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = hz; bp.Q.value = q;
    const gg = c.createGain(); gg.gain.value = g;
    filtro.connect(bp).connect(gg).connect(mistura);
  }

  // VIBRATO: entra depois do ataque, como um saxofonista faz — vibrato desde o primeiro
  // instante e a marca de sintetizador.
  const lfo = c.createOscillator();
  lfo.frequency.value = 5.2;
  const prof = c.createGain();
  prof.gain.setValueAtTime(0.0001, quando);
  prof.gain.setValueAtTime(0.0001, quando + 0.18);
  prof.gain.linearRampToValueAtTime(f * 0.008, Math.min(fim, quando + 0.55));
  lfo.connect(prof);
  lfo.start(quando); lfo.stop(fim);

  for (const [mult, ganho] of [[1, 1], [1.0029, 0.5]]) {
    const o = c.createOscillator();
    o.setPeriodicWave(ondaSax);
    o.frequency.setValueAtTime(f * mult * 0.985, quando);   // a palheta "pega" um pouco
    o.frequency.linearRampToValueAtTime(f * mult, quando + 0.05);  // abaixo e sobe
    prof.connect(o.frequency);
    const g = c.createGain(); g.gain.value = ganho;
    o.connect(g).connect(filtro);
    o.start(quando); o.stop(fim + 0.02);
  }

  // SOPRO: forte no ataque, baixinho durante a nota inteira
  const ar = c.createBufferSource();
  ar.buffer = bufSopro; ar.loop = true;
  const bp = c.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = Math.min(5000, Math.max(1400, f * 4)); bp.Q.value = 0.8;
  const ga = c.createGain();
  ga.gain.setValueAtTime(0.0001, quando);
  ga.gain.linearRampToValueAtTime(0.055, quando + 0.03);
  ga.gain.linearRampToValueAtTime(0.014, quando + 0.16);
  ga.gain.setValueAtTime(0.014, quando + dur);
  ga.gain.linearRampToValueAtTime(0.0001, fim);
  ar.connect(bp).connect(ga).connect(vol);
  ar.start(quando, Math.random() * 1.2);
  ar.stop(fim + 0.02);
}

// Acompanhamento: onda triangular filtrada, volume baixo e ataque mole. O sax e quem tem
// de ser ouvido — o acorde existe para dar o CHAO da harmonia, e por isso o baixo sai em
// senoide, que ocupa a regiao grave sem embolar as vozes de cima.
function tocarAcorde(midis, quando, segundos) {
  const c = audio();
  const dur = Math.max(segundos, 0.3);
  const fim = quando + dur;
  const vol = c.createGain();
  vol.gain.setValueAtTime(0.0001, quando);
  vol.gain.exponentialRampToValueAtTime(0.06, quando + 0.04);
  vol.gain.exponentialRampToValueAtTime(0.033, quando + Math.min(0.8, dur * 0.5));
  vol.gain.exponentialRampToValueAtTime(0.0001, fim + 0.3);
  const lp = c.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 2200;
  lp.Q.value = 0.6;
  midis.forEach((m, k) => {
    const o = c.createOscillator();
    o.type = k === 0 ? "sine" : "triangle";
    o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    const g = c.createGain();
    g.gain.value = (k === 0 ? 0.85 : 0.55) / Math.sqrt(midis.length);
    o.connect(g).connect(lp);
    o.start(quando);
    o.stop(fim + 0.35);
  });
  lp.connect(vol).connect(saidaAudio);
}

function cortarSaida() {
  // Derruba a saida e poe outra no lugar: o que ja estava agendado continua rodando,
  // mas desligado do alto-falante. E o unico jeito de calar na hora — Web Audio nao
  // deixa "desagendar" nota. Os osciladores morrem sozinhos no stop() deles.
  if (!saidaAudio) return;
  saidaAudio.disconnect();
  saidaAudio = ctxAudio.createGain();
  saidaAudio.connect(ctxAudio.destination);
}

function montarTocador(melodia, acomp, ctx) {
  const b = document.createElement("div");
  b.className = "bloco larga acc-violeta";
  const ico = (d, extra = "") => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true">${d}</svg>${extra}`;
  const temHarm = !!(acomp && acomp.length);
  b.innerHTML = `<h3>${temHarm ? "Ouvir e tocar junto" : "Ouvir a melodia"}</h3>
    <div class="tocador">
      <div class="transporte">
        <button type="button" class="icone atras" aria-label="Voltar 5 segundos">
          ${ico('<polygon points="11 19 2 12 11 5 11 19" fill="currentColor"/><line x1="20" y1="5" x2="20" y2="19"/>')}
        </button>
        <button type="button" class="icone play" aria-label="Tocar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <polygon class="ic-play" points="7 4 20 12 7 20" fill="currentColor"/>
            <g class="ic-pause" fill="currentColor"><rect x="7" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></g>
          </svg>
        </button>
        <button type="button" class="icone frente" aria-label="Avançar 5 segundos">
          ${ico('<polygon points="13 19 22 12 13 5 13 19" fill="currentColor"/><line x1="4" y1="5" x2="4" y2="19"/>')}
        </button>
      </div>
      <span class="relogio agora">0:00</span>
      <input type="range" class="linha" min="0" step="0.01" value="0" aria-label="Posição na música">
      <span class="relogio fim">0:00</span>
    </div>
    <label class="and">Andamento
      <input type="range" class="bpm-faixa" min="40" max="180" step="2" value="92">
      <span class="bpm">92 BPM</span></label>
    <div class="vozes"${temHarm ? "" : " hidden"}>
      <button type="button" class="btn-mini voz" data-voz="mel" aria-pressed="true">Melodia</button>
      <button type="button" class="btn-mini voz" data-voz="harm" aria-pressed="true">Acompanhamento</button>
    </div>`;
  comDica(b.querySelector("h3"), "Sax alto sintetizado, tocando as notas como estão "
    + "escritas — a altura é a da partitura, não a transposição do instrumento. "
    + "Arraste a linha para pular para outro trecho."
    + (temHarm ? " O acompanhamento são as cifras da própria partitura, soletradas e "
      + "postas no tempo da melodia. Desligue a melodia e ele fica tocando sozinho, "
      + "para você improvisar por cima." : ""));

  const bt = b.querySelector(".play"), linha = b.querySelector(".linha"),
        faixaBpm = b.querySelector(".bpm-faixa"), rotBpm = b.querySelector(".bpm"),
        relAgora = b.querySelector(".agora"), relFim = b.querySelector(".fim");
  const total = Math.max(melodia.total, melodia.notas[melodia.notas.length - 1].t + 1);
  linha.max = total;

  // ---- espelho do transporte, preso na base da tela. NAO e um segundo player: os botoes
  // chamam as mesmas funcoes e o estado (`pos`, `tocando`) continua sendo um so — o que
  // existe em dobro e a vitrine, nao o relogio.
  const rodape = document.createElement("div");
  rodape.className = "rodape-toca";
  rodape.hidden = true;
  rodape.innerHTML = `
    <button type="button" class="icone play" aria-label="Tocar">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <polygon class="ic-play" points="7 4 20 12 7 20" fill="currentColor"/>
        <g class="ic-pause" fill="currentColor"><rect x="7" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></g>
      </svg>
    </button>
    <span class="relogio agora">0:00</span>
    <input type="range" class="linha" min="0" step="0.01" value="0" aria-label="Posição na música">
    <span class="relogio fim">0:00</span>
    <button type="button" class="btn-mini sai-rodape">Esconder</button>`;
  document.body.append(rodape);
  const linhaR = rodape.querySelector(".linha");
  linhaR.max = total;
  const espelhos = [
    { linha, bt, agora: relAgora, fim: relFim },
    { linha: linhaR, bt: rodape.querySelector(".play"),
      agora: rodape.querySelector(".agora"), fim: rodape.querySelector(".fim") },
  ];

  // ---- onde a barra fica, em funcao do tempo. Dentro de uma pauta e interpolacao pura
  // entre a nota que acabou de soar e a proxima. Na ULTIMA nota da pauta a barra espera
  // ali parada: onde a pauta termina nao e uma coordenada que eu tenha — `pautas()` da a
  // altura das cinco linhas, nao o comprimento delas.
  const pautas = new Map();
  (melodia.sistemas || []).forEach(s => pautas.set(s.pg + ":" + s.sl, s));

  function ondeEstou(p) {
    const n = melodia.notas;
    if (!pautas.size || p < n[0].t) return null;
    let lo = 0, hi = n.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (n[m].t <= p) lo = m; else hi = m - 1; }
    const a = n[lo], b = n[lo + 1];
    const s = pautas.get(a.pg + ":" + a.sl);
    if (!s) return null;
    let x = a.x;
    if (b && b.pg === a.pg && b.sl === a.sl && b.t > a.t)
      x = a.x + (b.x - a.x) * Math.min(1, (p - a.t) / (b.t - a.t));
    return { pg: a.pg, sl: a.sl, x, topo: s.topo, base: s.base };
  }

  // A posicao e guardada em TEMPOS, nao em segundos: mudar o andamento no meio nao
  // pode fazer o cursor pular de lugar na musica.
  // `arrastando` guarda QUAL das duas linhas o dedo esta segurando (e nao so um sim/nao):
  // e o que permite a outra continuar acompanhando enquanto esta e arrastada
  let pos = 0, tocando = false, arrastando = null, relogio = null, i = 0, j = 0, ancora = 0;
  let seguindo = false;
  const harm = temHarm ? acomp : [];
  const ligado = { mel: true, harm: temHarm };
  const seg = () => 60 / Number(faixaBpm.value);
  const mmss = (s) => (s = Math.max(0, s),
    `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`);

  function pintar() {
    const pct = 100 * pos / total;
    const trilho = `linear-gradient(to right, var(--acento) ${pct}%, var(--sup3) ${pct}%)`;
    const agora = mmss(pos * seg()), fim = mmss(total * seg());
    for (const e of espelhos) {
      if (e.linha !== arrastando) e.linha.value = pos;
      e.linha.style.setProperty("--trilho", trilho);
      e.agora.textContent = agora;
      e.fim.textContent = fim;
    }
    if (seguindo && ctx?.seguir) ctx.seguir(ondeEstou(pos));
  }

  function ancorar() {            // recalcula o zero do relogio para a posicao atual
    const c = audio();
    ancora = c.currentTime + 0.08 - pos * seg();
    i = melodia.notas.findIndex(n => n.t >= pos - 1e-6);
    if (i < 0) i = melodia.notas.length;
    // o acorde que ja estava soando quando se pula para o meio nao e reatacado: comeco
    // pelo PROXIMO, senao a harmonia entra fora de lugar a cada arrastada da linha
    j = harm.findIndex(a => a.t >= pos - 1e-6);
    if (j < 0) j = harm.length;
  }

  function passo() {
    if (arrastando) return;
    const c = ctxAudio, s = seg();
    while (i < melodia.notas.length && ancora + melodia.notas[i].t * s < c.currentTime + 0.2) {
      const n = melodia.notas[i++];
      if (ligado.mel) tocarNota(n.midi, Math.max(c.currentTime, ancora + n.t * s), n.d * s);
    }
    while (j < harm.length && ancora + harm[j].t * s < c.currentTime + 0.2) {
      const a = harm[j++];
      if (ligado.harm) tocarAcorde(a.midi, Math.max(c.currentTime, ancora + a.t * s), a.d * s);
    }
    pos = Math.min(total, Math.max(0, (c.currentTime - ancora) / s));
    if (pos >= total) { parar(); pos = 0; }
    pintar();
  }

  const icone = (parado) => {
    for (const e of espelhos) {
      e.bt.classList.toggle("rodando", !parado);
      e.bt.setAttribute("aria-label", parado ? "Tocar" : "Pausar");
    }
  };

  function parar() {
    clearInterval(relogio);
    relogio = null;
    tocando = false;
    cortarSaida();
    icone(true);
  }

  function tocar() {
    const c = audio();
    c.resume();
    if (pos >= total - 0.01) pos = 0;
    tocando = true;
    seguindo = !!ctx?.seguir;
    // um rodape de cada vez: com varios arquivos na fila, todos teriam criado o seu e
    // eles se empilhariam na base da tela
    document.querySelectorAll(".rodape-toca").forEach(r => { r.hidden = r !== rodape; });
    ancorar();
    icone(false);
    clearInterval(relogio);
    relogio = setInterval(passo, 25);
  }

  function buscar(novo) {
    pos = Math.min(total, Math.max(0, novo));
    if (tocando) { cortarSaida(); ancorar(); }
    pintar();
  }

  b.querySelectorAll(".voz").forEach(v => v.addEventListener("click", () => {
    const alvo = v.dataset.voz;
    ligado[alvo] = !ligado[alvo];
    v.setAttribute("aria-pressed", String(ligado[alvo]));
    if (tocando) { cortarSaida(); ancorar(); }   // corta o que ja estava agendado
  }));

  espelhos.forEach(e => { e.bt.onclick = () => (tocando ? parar() : tocar()); });
  b.querySelector(".atras").onclick = () => buscar(pos - 5 / seg());
  b.querySelector(".frente").onclick = () => buscar(pos + 5 / seg());
  // Esconder e so tirar a faixa da frente — a musica segue tocando, que e o que se quer
  // ao querer a tela inteira para a partitura
  rodape.querySelector(".sai-rodape").onclick = () => { rodape.hidden = true; };

  const soltar = () => {
    if (!arrastando) return;
    arrastando = null;
    if (tocando) ancorar();
  };
  espelhos.forEach(e => {
    e.linha.addEventListener("pointerdown", () => { arrastando = e.linha; cortarSaida(); });
    e.linha.addEventListener("input", () => {
      pos = Number(e.linha.value);
      pintar();
      if (!arrastando && tocando) ancorar();   // seta do teclado: sem pointerdown
    });
    e.linha.addEventListener("pointerup", soltar);
    e.linha.addEventListener("pointercancel", soltar);
  });

  faixaBpm.addEventListener("input", () => {
    rotBpm.textContent = faixaBpm.value + " BPM";
    if (tocando) { cortarSaida(); ancorar(); }
    pintar();
  });

  pintar();
  return b;
}

function montarAnalise(info, ctx) {
