<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Pobre — nome das notas no seu PDF</title>
<meta name="description" content="Faça o upload do seu PDF de partitura e receba um arquivo com o nome de cada nota embaixo da pauta, mais a análise da música.">
<style>
  /* ---------------------------------------------------------------- tokens
     Escala tipografica com salto de ~1.25x, no maximo 3 tamanhos por bloco, e
     espaco em multiplos de 4. O acento e reservado para a acao primaria, o foco
     e o valor que o usuario veio buscar — em nenhum outro lugar.

     Superficie: quatro degraus (fundo -> cartao -> cartao interno -> realce).
     No tema escuro, ELEVACAO E LUZ, nao sombra: sombra preta sobre fundo preto
     nao aparece, entao cada nivel e um cinza um passo mais claro, com um fio de
     borda. No tema claro vale o contrario — a sombra e que separa. */
  :root {
    --t-xl: 2.125rem; --t-lg: 1.125rem; --t-md: 1rem; --t-sm: .875rem; --t-xs: .75rem;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px;

    --bg: #f7f5f1;  --sup: #fff;  --sup2: #f2efe9;  --sup3: #e9e5dc;
    --texto: #171614; --texto-2: #56534c; --texto-3: #7e7a72;
    --borda: #e5e0d7; --borda-forte: #cdc7bb;
    --acento: #2b4acb; --acento-texto: #fff; --acento-fraco: #e9edfd;
    --ok: #146c43; --erro: #b3261e;
    --pauta: rgba(23,22,20,.10);
    --sombra: 0 1px 2px rgba(20,18,14,.06), 0 8px 24px rgba(20,18,14,.07);
    --sombra-1: 0 1px 2px rgba(20,18,14,.05);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #101114;  --sup: #191b1f;  --sup2: #212429;  --sup3: #2a2e35;
    --texto: #f1efeb; --texto-2: #b3aea6; --texto-3: #918c84;
    --borda: #2b2f35; --borda-forte: #3c4149;
    --acento: #93a8ff; --acento-texto: #10131d; --acento-fraco: #1b2340;
    --ok: #62d69e; --erro: #ff9083;
    --pauta: rgba(241,239,235,.13);
    --sombra: none; --sombra-1: none;
  } }
  :root[data-theme="dark"] {
    --bg: #101114;  --sup: #191b1f;  --sup2: #212429;  --sup3: #2a2e35;
    --texto: #f1efeb; --texto-2: #b3aea6; --texto-3: #918c84;
    --borda: #2b2f35; --borda-forte: #3c4149;
    --acento: #93a8ff; --acento-texto: #10131d; --acento-fraco: #1b2340;
    --ok: #62d69e; --erro: #ff9083;
    --pauta: rgba(241,239,235,.13);
    --sombra: none; --sombra-1: none;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: var(--t-md)/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina { max-width: 760px; margin: 0 auto; padding: var(--s6) var(--s5) 96px; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: var(--r-sm); }

  h1 { font-size: var(--t-xl); line-height: 1.1; letter-spacing: -.024em; margin: 0 0 var(--s3);
       font-weight: 680; }
  h2 { font-size: var(--t-lg); line-height: 1.3; letter-spacing: -.011em; margin: 0 0 var(--s3); }
  p  { margin: 0 0 var(--s4); }
  .apoio { color: var(--texto-2); max-width: 56ch; }
  .meta  { color: var(--texto-3); font-size: var(--t-sm); }

  /* --------------------------------------------------------------- marca
     A identidade e o proprio assunto: cinco linhas de pauta. Aparece na marca e,
     bem apagada, atras do titulo — sem imagem, so gradiente repetido. */
  header { position: relative; margin-bottom: var(--s5); }
  header::before {
    content: ""; position: absolute; inset: -18px -12px auto -12px; height: 128px;
    background: repeating-linear-gradient(to bottom,
      transparent 0 13px, var(--pauta) 13px 14px, transparent 14px 27px);
    /* apaga em TODAS as direcoes: senao a pauta vira um punhado de rebarbas
       atravessando a pagina de ponta a ponta, e parece defeito, nao motivo */
    -webkit-mask-image: radial-gradient(120% 105% at 13% 6%, #000 0%,
                        rgba(0,0,0,.42) 40%, transparent 74%);
            mask-image: radial-gradient(120% 105% at 13% 6%, #000 0%,
                        rgba(0,0,0,.42) 40%, transparent 74%);
    pointer-events: none; z-index: 0;
  }
  header > * { position: relative; z-index: 1; }
  /* O nome e o titulo da pagina, nao uma etiqueta: cresce com a largura, mas para de
     crescer antes de encostar na borda em tela grande. */
  .marca { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
           margin: 0 0 var(--s2); font-size: clamp(2.5rem, 8.5vw, 3.9rem);
           font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .marca svg { display: block; color: var(--acento); flex: none; }
  .sub { font-size: var(--t-lg); color: var(--texto-2); font-weight: 500;
         margin: 0 0 var(--s3); }

  /* ------------------------------------------------------------- painel  */
  .painel { background: var(--sup); border: 1px solid var(--borda);
            border-radius: var(--r-lg); box-shadow: var(--sombra); overflow: hidden; }
  #zona {
    border: 0; border-bottom: 1px solid var(--borda); background: transparent;
    padding: var(--s6) var(--s5); text-align: center; cursor: pointer;
    display: block; width: 100%; font: inherit; color: inherit;
    transition: background .15s ease, color .15s ease;
  }
  #zona:hover { background: var(--sup2); }
  #zona.sobre { background: var(--acento-fraco); }
  #zona .titulo { font-size: var(--t-lg); font-weight: 640; display: block; margin-bottom: 2px; }
  #zona .sub { color: var(--texto-3); font-size: var(--t-sm); }
  #zona .alvo {
    width: 44px; height: 44px; margin: 0 auto var(--s3); border-radius: 50%;
    display: grid; place-items: center; color: var(--acento);
    background: var(--acento-fraco); transition: transform .12s ease;
  }
  #zona:hover .alvo, #zona.sobre .alvo { transform: translateY(-2px); }
  #arquivo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ------------------------------------------------------------- opcoes  */
  .opcoes {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5);
    padding: var(--s3) var(--s4); background: var(--sup2);
    font-size: var(--t-sm); color: var(--texto-2);
  }
  .grupo { display: inline-flex; align-items: center; gap: var(--s2); }
  .segmento { display: inline-flex; background: var(--sup3); border-radius: var(--r-sm); padding: 2px; }
  .segmento label {
    padding: 4px var(--s3); border-radius: 6px; cursor: pointer; color: var(--texto-2);
    transition: background .12s ease, color .12s ease; white-space: nowrap;
  }
  .segmento input { position: absolute; opacity: 0; width: 0; height: 0; }
  .segmento input:checked + span { color: var(--texto); font-weight: 620; }
  .segmento label:has(input:checked) { background: var(--sup); box-shadow: var(--sombra-1); }
  .segmento label:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 1px; }

  /* ------------------------------------------------------------ progresso */
  #barra { margin-top: var(--s4); display: none; }
  #barra.on { display: block; }
  #barra .rotulo { display: flex; justify-content: space-between; font-size: var(--t-sm);
                   color: var(--texto-2); margin-bottom: var(--s2); gap: var(--s3); }
  #barra .trilho { height: 6px; background: var(--sup3); border-radius: 99px; overflow: hidden; }
  #barra .cheio { height: 100%; width: 0%; background: var(--acento); border-radius: 99px;
                  transition: width .25s ease; }
  #barra.indeterminado .cheio { width: 35%; animation: correr 1.2s ease-in-out infinite; }
  @keyframes correr { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  /* -------------------------------------------------------------- lista  */
  #lista { margin-top: var(--s5); display: grid; gap: var(--s4); }
  .cartao {
    background: var(--sup); border: 1px solid var(--borda);
    border-radius: var(--r-lg); box-shadow: var(--sombra); overflow: hidden;
  }
  .topo { display: flex; align-items: center; gap: var(--s4); padding: var(--s4) var(--s5); }
  .ident { min-width: 0; flex: 1; }
  .ident .nome { font-weight: 640; overflow-wrap: anywhere; line-height: 1.35; }
  .ident .estado { font-size: var(--t-sm); color: var(--texto-2); margin-top: 2px; }
  .ident .estado.bom { color: var(--ok); }
  .ident .estado.ruim { color: var(--erro); }
  .ponto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--borda-forte); }
  .ponto.trabalhando { background: var(--acento); animation: pulsa 1s ease-in-out infinite; }
  .ponto.bom { background: var(--ok); }
  .ponto.ruim { background: var(--erro); }
  @keyframes pulsa { 50% { opacity: .35; } }

  .btn {
    font: inherit; font-size: var(--t-sm); font-weight: 620; border-radius: var(--r-sm);
    padding: 9px var(--s4); cursor: pointer; white-space: nowrap; text-decoration: none;
    border: 1px solid transparent; flex: none;
    transition: background .12s ease, color .12s ease, filter .12s ease;
  }
  .btn-primario { background: var(--acento); color: var(--acento-texto); }
  .btn-primario:hover { filter: brightness(1.08); }
  .btn-secundario { background: var(--sup2); color: var(--texto-2); border-color: var(--borda); }
  .btn-secundario:hover { background: var(--sup3); color: var(--texto); }

  /* ------------------------------------------------------------- analise */
  .analise { border-top: 1px solid var(--borda); background: var(--sup2); }
  .tit-analise { font-size: var(--t-xs); font-weight: 650; color: var(--texto-3);
                 text-transform: uppercase; letter-spacing: .09em;
                 padding: var(--s5) var(--s5) 0; margin: 0; }
  .selo {
    display: inline-flex; align-items: baseline; gap: 3px; flex: none;
    background: var(--acento-fraco); border: 1px solid transparent;
    border-radius: var(--r-sm); padding: 4px var(--s3); line-height: 1.1;
    color: var(--acento);
  }
  .selo .n { font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
  .selo .u { font-size: var(--t-xs); opacity: .75; }
  .analise > summary {
    padding: var(--s3) var(--s5); cursor: pointer; font-size: var(--t-sm);
    color: var(--texto-2); list-style: none; display: flex; align-items: center; gap: var(--s2);
  }
  .analise > summary::-webkit-details-marker { display: none; }
  .analise > summary::before { content: "▸"; font-size: .7em; transition: transform .15s ease; }
  .analise[open] > summary::before { transform: rotate(90deg); }
  .analise > summary:hover { color: var(--texto); }

  /* Duas colunas a partir de 640px: em coluna unica a analise virava uma fita
     sem fim, e o olho nao tinha onde parar. */
  .corpo { padding: var(--s4) var(--s5) var(--s5); display: grid; gap: var(--s3); }
  @media (min-width: 640px) { .corpo { grid-template-columns: 1fr 1fr; } }
  .corpo > .larga { grid-column: 1 / -1; }
  .bloco { background: var(--sup); border: 1px solid var(--borda);
           border-radius: var(--r-md); padding: var(--s4); }
  .bloco h3 { font-size: var(--t-xs); font-weight: 650; color: var(--texto-3);
              text-transform: uppercase; letter-spacing: .07em; margin: 0 0 var(--s3); }

  .fatos { display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
           gap: var(--s2); margin: 0; }
  .fato { background: var(--sup2); border-radius: var(--r-sm); padding: var(--s2) var(--s3); }
  .fato dt { font-size: var(--t-xs); color: var(--texto-3); text-transform: uppercase;
             letter-spacing: .06em; margin-bottom: 1px; }
  .fato dd { margin: 0; font-size: var(--t-lg); font-weight: 640; line-height: 1.2;
             font-variant-numeric: tabular-nums; }
  .fato dd .unid { font-size: var(--t-xs); font-weight: 400; color: var(--texto-3); }

  .fichas { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .ficha { background: var(--sup2); border: 1px solid var(--borda);
           border-radius: 99px; padding: 3px var(--s3); font-size: var(--t-sm);
           font-variant-numeric: tabular-nums; }
  .escalas { display: grid; gap: 0; font-size: var(--t-sm); margin: 0; }
  .escalas div { display: grid; grid-template-columns: 62px 1fr auto; gap: var(--s2);
                 align-items: baseline; padding: 5px 0; border-top: 1px solid var(--borda); }
  .escalas div:first-child { border-top: 0; padding-top: 0; }
  .escalas b { font-weight: 650; }
  .escalas .notas-ac { color: var(--texto); font-variant-numeric: tabular-nums; }
  .escalas .esc { color: var(--texto-3); font-size: var(--t-xs); text-align: right; }
  .escalas.campo-tom div { grid-template-columns: 104px 1fr auto; }
  .escalas.campo-tom b { color: var(--texto-2); font-variant-numeric: tabular-nums; }
  .escalas.comgrau div { grid-template-columns: 66px 46px 1fr auto; }
  .escalas .grau-ac { color: var(--texto-3); font-size: var(--t-xs);
                      font-variant-numeric: tabular-nums; }
  .escalas.cadencias b { font-variant-numeric: normal; }
  .graus { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .grau { background: var(--sup2); border: 1px solid var(--borda); border-radius: var(--r-sm);
          padding: 2px var(--s2); min-width: 44px; text-align: center; }
  .grau b { display: block; font-size: var(--t-sm); font-weight: 650;
            font-variant-numeric: tabular-nums; }
  .grau i { display: block; font-style: normal; font-size: var(--t-xs); color: var(--texto-3); }
  .grau.fora { border-color: var(--acento); }
  .aviso-campo { font-size: var(--t-xs); color: var(--texto-3); margin: var(--s2) 0 0; }
  .bloco > .aviso-campo:not(:last-child) { margin: -4px 0 var(--s3); }
  @media (max-width: 480px) {
    .escalas div { grid-template-columns: 52px 1fr; }
    .escalas .esc { grid-column: 2; text-align: left; }
    .escalas.comgrau div { grid-template-columns: 52px 44px 1fr; }
  }

  .vozes { display: flex; gap: var(--s2); margin-top: var(--s3); }
  .voz[aria-pressed="false"] { opacity: .42; }
  .voz[aria-pressed="true"] { border-color: var(--acento); }
  .medidor { display: flex; align-items: center; gap: var(--s3); }
  .medidor .trilho { display: block; flex: 1; height: 8px; background: var(--sup3);
                     border-radius: 99px; overflow: hidden; }
  .medidor .cheio { display: block; height: 100%; background: var(--acento);
                    border-radius: 99px; transition: width .3s ease; }
  .medidor .valor { font-size: 1.5rem; font-weight: 680; font-variant-numeric: tabular-nums;
                    line-height: 1; }

  /* -------------------------------------------------------------- player */
  .tocador { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .transporte { display: flex; align-items: center; gap: var(--s1); }
  .icone {
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--borda); background: var(--sup2);
    color: var(--texto-2); cursor: pointer; flex: none;
    transition: background .12s ease, color .12s ease;
  }
  .icone:hover { background: var(--sup3); color: var(--texto); }
  .icone.play { width: 42px; height: 42px; background: var(--acento);
                border-color: transparent; color: var(--acento-texto); }
  .icone.play:hover { filter: brightness(1.08); background: var(--acento); }
  .icone svg { display: block; }
  /* o atributo hidden do HTML nao vale dentro de SVG — tem de ser CSS */
  .icone.play .ic-pause { display: none; }
  .icone.play.rodando .ic-play { display: none; }
  .icone.play.rodando .ic-pause { display: inline; }
  .relogio { font-size: var(--t-xs); color: var(--texto-3);
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linha { flex: 1 1 120px; min-width: 100px; height: 20px; margin: 0;
           -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  .linha::-webkit-slider-runnable-track {
    height: 6px; border-radius: 99px; background: var(--trilho, var(--sup3)); }
  .linha::-moz-range-track {
    height: 6px; border-radius: 99px; background: var(--trilho, var(--sup3)); }
  .linha::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4px;
    border-radius: 50%; background: var(--acento); border: 0; }
  .linha::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--acento); border: 0; }
  .and { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3);
         font-size: var(--t-xs); color: var(--texto-3); }
  .and input[type=range] { width: 108px; accent-color: var(--acento); }
  .and .bpm { font-variant-numeric: tabular-nums; min-width: 4.4em; }

  /* ------------------------------------------------------------------ editor
     A previa vem SEM os nomes e os nomes sao um SVG por cima, em unidades de PONTO da
     pagina. Assim o overlay escala junto com a imagem sem nenhuma conta de zoom, e cada
     nome e um alvo de clique de verdade. */
  /* o .corpo e um grid: sem isso o palco e a dica virariam duas COLUNAS e a partitura
     encolhia para caber ao lado da legenda */
  .palco, .dica-editor, .barra-previa { grid-column: 1 / -1; }

  /* A pagina tem 760px para o texto ficar legivel, mas o RESULTADO quer todo o espaco que
     houver: a lista de cartoes escapa do container e se centra numa faixa mais larga. E o
     cartao inteiro que se alarga, e nao um filho dele — filho vazando e recortado pelo
     cartao e ainda cria rolagem horizontal. */
  #lista.largo { width: min(1320px, calc(100vw - 2.5rem));
                 margin-left: 50%; transform: translateX(-50%); }
  /* abaixo disso a faixa larga sairia MENOR que a coluna normal: nao alarga nada */
  @media (max-width: 860px) {
    #lista.largo { width: auto; margin-left: 0; transform: none; }
  }


  .palco { position: relative; display: block; border-radius: var(--r-md);
           overflow: hidden; box-shadow: var(--sombra); }
  .palco > img { display: block; width: 100%; height: auto; border: 0; border-radius: 0; }
  .palco svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .barra-previa { display: flex; align-items: center; gap: var(--s3);
                  margin-bottom: var(--s2); }
  .barra-previa .rot { font-size: var(--t-sm); font-weight: 600; color: var(--texto-2);
                       letter-spacing: .02em; }
  .barra-previa .esticar { margin-left: auto; }
  .paginacao { display: flex; align-items: center; gap: var(--s2);
               font-size: var(--t-xs); color: var(--texto-2); }
  .paginacao button { padding: .15rem .5rem; }
  .paginacao button[disabled] { opacity: .35; cursor: default; }
  .btn-mini { padding: .3rem .6rem; font-size: var(--t-xs); border-radius: var(--r-sm);
              background: var(--sup2); color: var(--texto-2);
              border: 1px solid var(--borda); cursor: pointer; }
  .btn-mini:hover { background: var(--sup3); color: var(--texto); }

  /* Ampliado maximiza a LARGURA e rola na vertical. Limitar pela altura da tela era pior
     que nao ampliar: a pagina e retrato, a tela e paisagem, e a partitura saia mais estreita
     do que no tamanho normal. O palco encolhe para o tamanho da imagem e o SVG, que e 100%
     do palco, acompanha sem conta extra. */
  .lupa { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center;
          align-items: start; padding: var(--s2) var(--s2) var(--s7);
          overflow: auto; background: var(--bg); }
  .lupa .palco { width: fit-content; max-width: none; border-radius: var(--r-sm); }
  .lupa .palco > img { width: min(1900px, calc(100vw - 2 * var(--s2))); height: auto; }
  .lupa-fechar { position: fixed; top: var(--s3); right: var(--s3); z-index: 61; }
  /* PRETO fixo, nao currentColor: o fundo aqui e a partitura branca, e o tema escuro
     herdava cinza-claro — os nomes ficavam ilegiveis. Preto tambem e o que o PDF estampa,
     entao o overlay mostra o resultado de verdade. */
  .palco svg text { fill: #111; font-family: Helvetica, Arial, sans-serif;
                    pointer-events: none; }
  /* ALVO DE TOQUE: o nome tem ~8pt de altura, alvo pequeno demais para o dedo. Quem recebe
     o clique e um retangulo invisivel bem maior em volta; o texto fica so como desenho. */
  .palco svg .toque { fill: transparent; cursor: pointer; }
  .palco svg .toque:hover + text { fill: #4f46e5; }
  .palco svg g.sel text { fill: #4f46e5; font-weight: 700; }
  .palco svg g.sel .toque { fill: rgba(79,70,229,.12); }
  .palco.pondo { cursor: crosshair; }
  .paleta { position: absolute; z-index: 6; display: flex; flex-wrap: wrap; gap: 3px;
            width: 13rem; padding: 4px; border-radius: var(--r-sm);
            background: var(--sup1); border: 1px solid var(--borda);
            box-shadow: 0 6px 18px rgba(0,0,0,.28); }
  .paleta button { padding: .18rem .38rem; font-size: var(--t-xs); line-height: 1.1;
                   min-width: 1.7rem; border-radius: 6px; cursor: pointer;
                   background: var(--sup2); color: var(--texto);
                   border: 1px solid var(--borda); }
  .paleta button:hover { background: var(--acento); color: var(--acento-texto); }
  .paleta .acc { font-weight: 700; }
  .paleta .zap { margin-left: auto; color: var(--erro); }
  .campo { position: absolute; z-index: 5; width: 5.2rem; padding: .2rem .35rem;
           font: inherit; font-size: var(--t--1); text-align: center;
           background: var(--sup1); color: var(--texto);
           border: 1px solid var(--acento); border-radius: var(--r-sm); }
  .dica-editor { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
                 margin-top: var(--s3); font-size: var(--t--1); color: var(--texto-2); }
  .dica-editor .chip { padding: .12rem .45rem; border: 1px solid var(--borda);
                       border-radius: 999px; }
  .previa img { width: 100%; border: 1px solid var(--borda); border-radius: var(--r-sm);
                background: #fff; display: block; }
  .previa { padding: 0 var(--s5) var(--s5); }

  /* ---------------------------------------------------------------- dicas
     Um balao so, position:fixed e preso no body. Dentro do cartao ele seria
     cortado pelo overflow:hidden, e mexer no z-index nao resolveria isso. */
  .tem-dica { cursor: help; }
  .bloco h3.tem-dica, .tem-dica dt {
    text-decoration: underline dotted; text-decoration-color: var(--borda-forte);
    text-underline-offset: 3px;
  }
  .bloco h3.tem-dica:hover, .tem-dica:hover dt { text-decoration-color: var(--texto-3); }
  .dica {
    position: fixed; z-index: 90; left: 0; top: 0;
    max-width: min(330px, calc(100vw - 24px));
    background: var(--sup3); color: var(--texto);
    border: 1px solid var(--borda-forte); border-radius: var(--r-md);
    padding: var(--s3) var(--s4); font-size: var(--t-sm); line-height: 1.45;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
    opacity: 0; visibility: hidden; transform: translateY(3px);
    transition: opacity .12s ease, transform .12s ease, visibility .12s;
    pointer-events: none;
  }
  .dica.on { opacity: 1; visibility: visible; transform: none; }
  .dica p { margin: 0 0 var(--s2); }
  .dica p:last-child, .dica ul:last-child { margin-bottom: 0; }
  .dica ul { margin: 0 0 var(--s2); padding-left: 1.05em; }
  .dica li { margin-bottom: 2px; }
  .dica b { font-weight: 650; }

  /* --------------------------------------------------------------- fim   */
  .nota-rodape { margin-top: var(--s6); color: var(--texto-3); font-size: var(--t-sm); }
  footer { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--borda);
           color: var(--texto-3); font-size: var(--t-sm); }
  footer a { color: var(--acento); }
  @media (max-width: 560px) {
    .pagina { padding: var(--s5) var(--s4) 72px; }
    :root { --t-xl: 1.75rem; }
    .topo { flex-wrap: wrap; padding: var(--s4); }
    .topo .btn { width: 100%; text-align: center; }
    .corpo, .tit-analise, .previa { padding-left: var(--s4); padding-right: var(--s4); }
  }
</style>

<body>
<div class="pagina">
  <header>

      <svg width="54" height="39" viewBox="0 0 26 19" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1" opacity=".5" fill="none">

        </g>

    </h1>

    </p>

             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M3 15v3a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-3"/>
        </svg>
      </span>

    <div class="trilho"><div class="cheio" id="barra-cheio"></div></div>

  </p>

  </footer>

<script type="module">
const $ = (s) => document.querySelector(s);
const zona = $("#zona"), entrada = $("#arquivo"), lista = $("#lista");
const barra = $("#barra"), barraTxt = $("#barra-txt"), barraNum = $("#barra-num"),
      barraCheio = $("#barra-cheio");
const MAX_MB = 40;

// ---------------------------------------------------------------- dicas
// Balao unico reaproveitado. Aparece no hover, no foco pelo teclado e no toque;
// some com Esc, ao rolar a pagina e ao tocar em qualquer outro lugar.
const DICA = document.createElement("div");
DICA.className = "dica";
DICA.id = "dica";
DICA.setAttribute("role", "tooltip");
document.body.append(DICA);
let alvoDica = null, ultimoPonteiro = "mouse";
const trecho = (html) => document.createRange().createContextualFragment(html);

function mostrarDica(el) {
  if (!el._dica) return;
  DICA.replaceChildren(el._dica.cloneNode(true));
  DICA.classList.add("on");
  const a = el.getBoundingClientRect(), d = DICA.getBoundingClientRect();
  const x = Math.max(8, Math.min(a.left + a.width / 2 - d.width / 2, innerWidth - d.width - 8));
  const acima = a.top - d.height - 8;
  DICA.style.left = x + "px";
  DICA.style.top = (acima >= 8 ? acima : a.bottom + 8) + "px";
  el.setAttribute("aria-describedby", "dica");
  alvoDica = el;
}

function esconderDica() {
  DICA.classList.remove("on");
  alvoDica?.removeAttribute("aria-describedby");
  alvoDica = null;
}

function comDica(el, conteudo) {
  if (!el) return el;
  el._dica = typeof conteudo === "string" ? document.createTextNode(conteudo) : conteudo;
  el.classList.add("tem-dica");
  if (el.tabIndex < 0) el.tabIndex = 0;
  el.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && mostrarDica(el));
  el.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && esconderDica());
  el.addEventListener("focus", () => mostrarDica(el));
  el.addEventListener("blur", esconderDica);
  el.addEventListener("click", () => {
    if (ultimoPonteiro === "mouse") return;      // no mouse o hover ja resolveu
    alvoDica === el ? esconderDica() : mostrarDica(el);
  });
  return el;
}
addEventListener("pointerdown", (e) => {
  ultimoPonteiro = e.pointerType || "mouse";
  if (alvoDica && !alvoDica.contains(e.target)) esconderDica();
}, true);
addEventListener("keydown", (e) => e.key === "Escape" && esconderDica());
addEventListener("scroll", esconderDica, true);
addEventListener("resize", esconderDica);

function progresso({ texto = "", feito = 0, total = 0, indet = false, on = true }) {
  barra.classList.toggle("on", on);
  barra.classList.toggle("indeterminado", indet);
  barraTxt.textContent = texto;
  barraNum.textContent = total > 1 ? `${feito} de ${total}` : "";
  barraCheio.style.width = indet ? "" : (total ? (100 * feito / total) + "%" : "0%");
}

// ---- Pyodide sob demanda: so baixa quando chega o primeiro arquivo
let pyPromise = null;
const V = "?v=28";

function pegarPy() {
  if (pyPromise) return pyPromise;
  pyPromise = (async () => {
    progresso({ texto: "A fé nao costumaa faiar.", indet: true });
    const { loadPyodide } = await import("https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.mjs");
    const py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/" });
    await py.loadPackage("pymupdf");
    for (const arq of ["anotar_partitura.py", "analise.py", "dificuldade.py",
                       "bitmap.py", "pesos_dificuldade.json"]) {
      py.FS.writeFile("/" + arq, await (await fetch(arq + V)).text());
    }
    py.runPython("import sys; sys.path.insert(0, '/')\nimport anotar_partitura, analise, dificuldade");
    return py;
  })();
  return pyPromise;
}

// O opencv e o banco de templates custam ~11 MB, e SO servem para imagem. Quem manda
// PDF nao paga por eles — por isso a carga e sob demanda, e uma vez so.
let cvPromise = null;
function prepararImagem(py) {
  if (cvPromise) return cvPromise;
  cvPromise = (async () => {
    progresso({ texto: "Primeira imagem: baixando o leitor de pixels (11 MB).", indet: true });
    await py.loadPackage("opencv-python");
    py.FS.writeFile("/templates_bitmap.json",
                    await (await fetch("templates_bitmap.json" + V)).text());
    py.runPython("import bitmap; bitmap.carregar_banco('/templates_bitmap.json')");
  })();
  return cvPromise;
}

// ---- um cartao por arquivo, criado ANTES de processar
function criarCartao(nome) {
  const c = document.createElement("div");
  c.className = "cartao";
  c.innerHTML = `<div class="topo">
      <span class="ponto"></span>
      <div class="ident"><div class="nome"></div><div class="estado">na fila</div></div>
    </div>`;
  c.querySelector(".nome").textContent = nome;
  lista.append(c);
  return {
    raiz: c,
    ponto: c.querySelector(".ponto"),
    estado: c.querySelector(".estado"),
    topo: c.querySelector(".topo"),
    marcar(classe, texto) {
      this.ponto.className = "ponto " + classe;
      this.estado.className = "estado " + (classe === "trabalhando" ? "" : classe);
      this.estado.textContent = texto;
    },
  };
}

function ficha(txt) {
  const e = document.createElement("span");
  e.className = "ficha";
  e.textContent = txt;
  return e;
}

// ---- piano sintetizado no Web Audio: sem sample, sem rede, funciona offline.
// A cor de piano vem de tres coisas: parciais com amplitude decrescente, um filtro
// que fecha enquanto a nota morre (a corda perde brilho antes de perder volume) e
// um estalo curtinho de ruido no ataque, que e o martelo.
let ctxAudio = null, ondaSax = null, bufSopro = null, saidaAudio = null;
function audio() {
  if (ctxAudio) return ctxAudio;
  ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  saidaAudio = ctxAudio.createGain();
  saidaAudio.connect(ctxAudio.destination);
  // TIMBRE DE SAX ALTO. O sax e um tubo CONICO com palheta: soam todos os harmonicos
  // (diferente da clarineta, cilindrica, que enfatiza os impares), com 2o e 3o fortes — e
  // dai vem o corpo "encorpado" dele. Aqui isso e uma PeriodicWave; a parte imaginaria
  // espalha as fases, senao a onda fica com um pico duro e soa eletronica.
  const re = [0, 1, .72, .56, .36, .26, .175, .12, .085, .06, .042, .03, .021, .015, .011];
  const im = re.map((a, k) => k % 2 ? a * 0.35 : -a * 0.22);
  ondaSax = ctxAudio.createPeriodicWave(Float32Array.from(re), Float32Array.from(im),
                                       { disableNormalization: false });
  // ruido de SOPRO: 1,5 s em loop. Existe no ataque (o "ch" da palheta pegando) e continua
  // baixinho no sustain, que e o que faz soar soprado em vez de sintetizado.
  bufSopro = ctxAudio.createBuffer(1, Math.floor(ctxAudio.sampleRate * 1.5), ctxAudio.sampleRate);
  const d = bufSopro.getChannelData(0);
  let m = 0;
  for (let i = 0; i < d.length; i++) {          // ruido levemente rosa: menos assobio
    m = 0.82 * m + 0.18 * (Math.random() * 2 - 1);
    d[i] = m * 2.2;
  }
  return ctxAudio;
}

function tocarNota(midi, quando, segundos) {
  const c = audio(), f = 440 * Math.pow(2, (midi - 69) / 12);
  // Sax NAO tem cauda de ressonancia como piano: enquanto sopra soa, quando para cala.
  // Entao a nota dura o que tem de durar, com um release curto.
  const dur = Math.max(segundos, 0.12);
  const rel = 0.085;
  const fim = quando + dur + rel;

  const vol = c.createGain();
  // ataque de PALHETA: ~45 ms, com um leve pico antes de assentar no sustain. Ataque
  // instantaneo soa a orgao; lento demais soa a flauta.
  vol.gain.setValueAtTime(0.0001, quando);
  vol.gain.exponentialRampToValueAtTime(0.26, quando + 0.045);
  vol.gain.exponentialRampToValueAtTime(0.195, quando + Math.min(0.16, dur * 0.5));
  vol.gain.setValueAtTime(0.195, Math.max(quando + 0.05, quando + dur - 0.01));
  vol.gain.exponentialRampToValueAtTime(0.0001, fim);

  const filtro = c.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.Q.value = 1.4;
  // o brilho ENTRA junto com o ar, nao comeca aberto: cutoff sobe no ataque e recua no fim
  // Os limites tem PISO ABSOLUTO, nao so multiplo da nota: com cutoff puramente relativo
  // (f*8) o corte caia sobre o 7o harmonico de um la 440 e o timbre perdia o brilho — medi
  // h7=0,06 e h8=0,02, quando o sax real ainda tem energia ali. Sax alto vive de 3 a 5 kHz.
  filtro.frequency.setValueAtTime(Math.max(800, f * 2.4), quando);
  filtro.frequency.linearRampToValueAtTime(Math.min(11000, Math.max(4600, f * 11)), quando + 0.07);
  filtro.frequency.linearRampToValueAtTime(Math.min(9000, Math.max(3200, f * 7.5)), quando + dur);
  filtro.frequency.linearRampToValueAtTime(Math.max(900, f * 3), fim);

  // FORMANTES: dois picos fixos (~700 Hz e ~1650 Hz) somados por cima. E o que da o
  // caracter meio nasal, meio vocal do sax — sem eles o timbre fica generico.
  const mistura = c.createGain();
  mistura.connect(vol).connect(saidaAudio);
  filtro.connect(mistura);
  // O de 700 Hz vai em 0,42 e nao 0,5: com 0,5 ele cai em cima do 3o harmonico de um la
  // grave (660 Hz) e deixava o harmonico mais forte que a fundamental — encorpado virava oco.
  for (const [hz, q, g] of [[700, 3.0, 0.42], [1650, 4.0, 0.34]]) {
    const bp = c.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = hz; bp.Q.value = q;
    const gg = c.createGain(); gg.gain.value = g;
    filtro.connect(bp).connect(gg).connect(mistura);
  }

  // VIBRATO: entra depois do ataque, como um saxofonista faz — vibrato desde o primeiro
  // instante e a marca de sintetizador.
  const lfo = c.createOscillator();
  lfo.frequency.value = 5.2;
  const prof = c.createGain();
  prof.gain.setValueAtTime(0.0001, quando);
  prof.gain.setValueAtTime(0.0001, quando + 0.18);
  prof.gain.linearRampToValueAtTime(f * 0.008, Math.min(fim, quando + 0.55));
  lfo.connect(prof);
  lfo.start(quando); lfo.stop(fim);

  for (const [mult, ganho] of [[1, 1], [1.0029, 0.5]]) {
    const o = c.createOscillator();
    o.setPeriodicWave(ondaSax);
    o.frequency.setValueAtTime(f * mult * 0.985, quando);   // a palheta "pega" um pouco
    o.frequency.linearRampToValueAtTime(f * mult, quando + 0.05);  // abaixo e sobe
    prof.connect(o.frequency);
    const g = c.createGain(); g.gain.value = ganho;
    o.connect(g).connect(filtro);
    o.start(quando); o.stop(fim + 0.02);
  }

  // SOPRO: forte no ataque, baixinho durante a nota inteira
  const ar = c.createBufferSource();
  ar.buffer = bufSopro; ar.loop = true;
  const bp = c.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = Math.min(5000, Math.max(1400, f * 4)); bp.Q.value = 0.8;
  const ga = c.createGain();
  ga.gain.setValueAtTime(0.0001, quando);
  ga.gain.linearRampToValueAtTime(0.055, quando + 0.03);
  ga.gain.linearRampToValueAtTime(0.014, quando + 0.16);
  ga.gain.setValueAtTime(0.014, quando + dur);
  ga.gain.linearRampToValueAtTime(0.0001, fim);
  ar.connect(bp).connect(ga).connect(vol);
  ar.start(quando, Math.random() * 1.2);
  ar.stop(fim + 0.02);
}

// Acompanhamento: onda triangular filtrada, volume baixo e ataque mole. O sax e quem tem
// de ser ouvido — o acorde existe para dar o CHAO da harmonia, e por isso o baixo sai em
// senoide, que ocupa a regiao grave sem embolar as vozes de cima.
function tocarAcorde(midis, quando, segundos) {
  const c = audio();
  const dur = Math.max(segundos, 0.3);
  const fim = quando + dur;
  const vol = c.createGain();
  vol.gain.setValueAtTime(0.0001, quando);
  vol.gain.exponentialRampToValueAtTime(0.06, quando + 0.04);
  vol.gain.exponentialRampToValueAtTime(0.033, quando + Math.min(0.8, dur * 0.5));
  vol.gain.exponentialRampToValueAtTime(0.0001, fim + 0.3);
  const lp = c.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 2200;
  lp.Q.value = 0.6;
  midis.forEach((m, k) => {
    const o = c.createOscillator();
    o.type = k === 0 ? "sine" : "triangle";
    o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    const g = c.createGain();
    g.gain.value = (k === 0 ? 0.85 : 0.55) / Math.sqrt(midis.length);
    o.connect(g).connect(lp);
    o.start(quando);
    o.stop(fim + 0.35);
  });
  lp.connect(vol).connect(saidaAudio);
}

function cortarSaida() {
  // Derruba a saida e poe outra no lugar: o que ja estava agendado continua rodando,
  // mas desligado do alto-falante. E o unico jeito de calar na hora — Web Audio nao
  // deixa "desagendar" nota. Os osciladores morrem sozinhos no stop() deles.
  if (!saidaAudio) return;
  saidaAudio.disconnect();
  saidaAudio = ctxAudio.createGain();
  saidaAudio.connect(ctxAudio.destination);
}

function montarTocador(melodia, acomp) {
  const b = document.createElement("div");
  b.className = "bloco larga";
  const ico = (d, extra = "") => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true">${d}</svg>${extra}`;
  const temHarm = !!(acomp && acomp.length);
  b.innerHTML = `<h3>${temHarm ? "Ouvir e tocar junto" : "Ouvir a melodia"}</h3>
    <div class="tocador">
      <div class="transporte">
        <button type="button" class="icone atras" aria-label="Voltar 5 segundos">
          ${ico('<polygon points="11 19 2 12 11 5 11 19" fill="currentColor"/><line x1="20" y1="5" x2="20" y2="19"/>')}
        </button>
        <button type="button" class="icone play" aria-label="Tocar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <polygon class="ic-play" points="7 4 20 12 7 20" fill="currentColor"/>
            <g class="ic-pause" fill="currentColor"><rect x="7" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></g>
          </svg>
        </button>
        <button type="button" class="icone frente" aria-label="Avançar 5 segundos">
          ${ico('<polygon points="13 19 22 12 13 5 13 19" fill="currentColor"/><line x1="4" y1="5" x2="4" y2="19"/>')}
        </button>
      </div>
      <span class="relogio agora">0:00</span>
      <input type="range" class="linha" min="0" step="0.01" value="0" aria-label="Posição na música">
      <span class="relogio fim">0:00</span>
    </div>
    <label class="and">Andamento
      <input type="range" class="bpm-faixa" min="40" max="180" step="2" value="92">
      <span class="bpm">92 BPM</span></label>
    <div class="vozes"${temHarm ? "" : " hidden"}>
      <button type="button" class="btn-mini voz" data-voz="mel" aria-pressed="true">Melodia</button>
      <button type="button" class="btn-mini voz" data-voz="harm" aria-pressed="true">Acompanhamento</button>
    </div>`;
  comDica(b.querySelector("h3"), "Sax alto sintetizado, tocando as notas como estão "
    + "escritas — a altura é a da partitura, não a transposição do instrumento. "
    + "Arraste a linha para pular para outro trecho."
    + (temHarm ? " O acompanhamento são as cifras da própria partitura, soletradas e "
      + "postas no tempo da melodia. Desligue a melodia e ele fica tocando sozinho, "
      + "para você improvisar por cima." : ""));

  const bt = b.querySelector(".play"), linha = b.querySelector(".linha"),
        faixaBpm = b.querySelector(".bpm-faixa"), rotBpm = b.querySelector(".bpm"),
        relAgora = b.querySelector(".agora"), relFim = b.querySelector(".fim");
  const total = Math.max(melodia.total, melodia.notas[melodia.notas.length - 1].t + 1);
  linha.max = total;

  // A posicao e guardada em TEMPOS, nao em segundos: mudar o andamento no meio nao
  // pode fazer o cursor pular de lugar na musica.
  let pos = 0, tocando = false, arrastando = false, relogio = null, i = 0, j = 0, ancora = 0;
  const harm = temHarm ? acomp : [];
  const ligado = { mel: true, harm: temHarm };
  const seg = () => 60 / Number(faixaBpm.value);
  const mmss = (s) => (s = Math.max(0, s),
    `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`);

  function pintar() {
    if (!arrastando) linha.value = pos;
    const pct = 100 * pos / total;
    linha.style.setProperty("--trilho",
      `linear-gradient(to right, var(--acento) ${pct}%, var(--sup3) ${pct}%)`);
    relAgora.textContent = mmss(pos * seg());
    relFim.textContent = mmss(total * seg());
  }

  function ancorar() {            // recalcula o zero do relogio para a posicao atual
    const c = audio();
    ancora = c.currentTime + 0.08 - pos * seg();
    i = melodia.notas.findIndex(n => n.t >= pos - 1e-6);
    if (i < 0) i = melodia.notas.length;
    // o acorde que ja estava soando quando se pula para o meio nao e reatacado: comeco
    // pelo PROXIMO, senao a harmonia entra fora de lugar a cada arrastada da linha
    j = harm.findIndex(a => a.t >= pos - 1e-6);
    if (j < 0) j = harm.length;
  }

  function passo() {
    if (arrastando) return;
    const c = ctxAudio, s = seg();
    while (i < melodia.notas.length && ancora + melodia.notas[i].t * s < c.currentTime + 0.2) {
      const n = melodia.notas[i++];
      if (ligado.mel) tocarNota(n.midi, Math.max(c.currentTime, ancora + n.t * s), n.d * s);
    }
    while (j < harm.length && ancora + harm[j].t * s < c.currentTime + 0.2) {
      const a = harm[j++];
      if (ligado.harm) tocarAcorde(a.midi, Math.max(c.currentTime, ancora + a.t * s), a.d * s);
    }
    pos = Math.min(total, Math.max(0, (c.currentTime - ancora) / s));
    if (pos >= total) { parar(); pos = 0; }
    pintar();
  }

  const icone = (parado) => {
    bt.classList.toggle("rodando", !parado);
    bt.setAttribute("aria-label", parado ? "Tocar" : "Pausar");
  };

  function parar() {
    clearInterval(relogio);
    relogio = null;
    tocando = false;
    cortarSaida();
    icone(true);
  }

  function tocar() {
    const c = audio();
    c.resume();
    if (pos >= total - 0.01) pos = 0;
    tocando = true;
    ancorar();
    icone(false);
    clearInterval(relogio);
    relogio = setInterval(passo, 25);
  }

  function buscar(novo) {
    pos = Math.min(total, Math.max(0, novo));
    if (tocando) { cortarSaida(); ancorar(); }
    pintar();
  }

  b.querySelectorAll(".voz").forEach(v => v.addEventListener("click", () => {
    const alvo = v.dataset.voz;
    ligado[alvo] = !ligado[alvo];
    v.setAttribute("aria-pressed", String(ligado[alvo]));
    if (tocando) { cortarSaida(); ancorar(); }   // corta o que ja estava agendado
  }));

  bt.onclick = () => (tocando ? parar() : tocar());
  b.querySelector(".atras").onclick = () => buscar(pos - 5 / seg());
  b.querySelector(".frente").onclick = () => buscar(pos + 5 / seg());

  linha.addEventListener("pointerdown", () => { arrastando = true; cortarSaida(); });
  linha.addEventListener("input", () => {
    pos = Number(linha.value);
    pintar();
    if (!arrastando && tocando) ancorar();     // seta do teclado: sem pointerdown
  });
  const soltar = () => {
    if (!arrastando) return;
    arrastando = false;
    if (tocando) ancorar();
  };
  linha.addEventListener("pointerup", soltar);
  linha.addEventListener("pointercancel", soltar);

  faixaBpm.addEventListener("input", () => {
    rotBpm.textContent = faixaBpm.value + " BPM";
    if (tocando) { cortarSaida(); ancorar(); }
    pintar();
  });

  pintar();
  return b;
}

function montarAnalise(info, dificuldade) {
  const d = document.createElement("section");
  d.className = "analise aberta";
  d.innerHTML = `<h2 class="tit-analise">Análise da música</h2><div class="corpo"></div>`;
  const corpo = d.querySelector(".corpo");

  const fatos = document.createElement("dl");
  fatos.className = "fatos larga";
  const DICAS = {
    "Tom": `A armadura diz em que tom a música está. Maior costuma soar mais aberto e
            menor mais fechado. A relativa deste é ${info.tom_relativo}.`
           + (info.tom_por === "cifra"
              ? " Aqui quem decidiu entre maior e menor foi a harmonia: qual acorde faz de"
                + " tônica e, principalmente, qual acorde fecha a música."
              : " Aqui quem decidiu entre maior e menor foi o peso das notas na melodia,"
                + " porque a partitura não trouxe cifra."),
    "Soa em": "O sax alto é um instrumento em Mi bemol: o que sai dele é uma sexta maior "
              + "mais grave do que está escrito. Este é o tom que o piano ouve — é o que "
              + "você diz para a banda quando alguém pergunta o tom da música.",
    "Compasso": "A fórmula não vem escrita em lugar nenhum do arquivo: ela sai da soma das "
                + "durações de cada compasso. A soma que mais aparece é a fórmula, porque "
                + "anacruse e compasso final são exceção legítima.",
    "Âmbito": "Da nota mais grave até a mais aguda, na altura escrita, que no sax alto é "
              + "diferente da que sai.",
    "Extensão": "A distância entre essas duas notas em semitons. Doze semitons dão uma oitava.",
    "Notas": "Quantas cabeças de nota o arquivo tem ao todo.",
    "Compassos": "Trechos entre uma barra vertical e a seguinte.",
    "Alteradas": "Quanto da música tem sustenido, bemol ou bequadro. Quanto maior essa "
                 + "fatia, mais cromática a peça, e cromatismo dá trabalho no dedilhado.",
  };
  const linhas = [
    ["Tom", info.tom, ""],
    ["Soa em", info.real?.tom || "—", ""],
    ["Compasso", info.ritmo?.formula || "—", ""],
    ["Âmbito", `${info.grave}–${info.agudo}`, ""],
    ["Extensão", info.extensao, "semitons"],
    ["Notas", info.n_notas, ""],
    ["Compassos", info.compassos, ""],
    ["Alteradas", Math.round(info.frac_alteradas * 100) + "%", ""],
  ];
  for (const [rot, val, unid] of linhas) {
    const w = document.createElement("div");
    w.className = "fato";
    comDica(w, DICAS[rot] || "");
    w.innerHTML = `<dt></dt><dd></dd>`;
    w.querySelector("dt").textContent = rot;
    w.querySelector("dd").textContent = val;
    if (unid) {
      const u = document.createElement("span");
      u.className = "unid";
      u.textContent = " " + unid;
      w.querySelector("dd").append(u);
    }
    fatos.append(w);
  }
  corpo.append(fatos);
  if (info.melodia?.notas?.length)
    corpo.append(montarTocador(info.melodia, info.acompanhamento));

  if (dificuldade != null) {
    const b = document.createElement("div");
    b.className = "bloco";
    b.innerHTML = `<h3>Dificuldade no sax alto</h3>
      <div class="medidor"><span class="valor"></span>
      <span class="trilho"><span class="cheio"></span></span>
      <span class="meta">de 10</span></div>`;
    b.querySelector(".valor").textContent = dificuldade.toFixed(1);
    b.querySelector(".cheio").style.width = (10 * dificuldade) + "%";
    comDica(b.querySelector("h3"), trecho(`
      <p>Cada partitura vira seis medidas. Cada uma tem um peso, e a soma delas dá a nota.</p>
      <ul>
        <li><b>Notas diferentes</b>: quantas alturas distintas a música usa. É a de maior peso.</li>
        <li><b>Alteradas</b>: quanto dela é cromática.</li>
        <li><b>Extensão</b>: da nota mais grave até a mais aguda.</li>
        <li><b>Agudo</b>: o que passa do dó agudo, onde entra a chave de palma.</li>
        <li><b>Altíssimo</b>: o que passa do registro normal do sax.</li>
        <li><b>Quebras de registro</b>: quantas vezes a melodia atravessa a virada de oitava.</li>
      </ul>
      <p>Os pesos vieram de 572 partituras já marcadas como iniciante, intermediário ou
      avançado, e todos ficaram positivos, para que nenhum fator deixe a peça mais fácil.
      Fora da amostra a nota acerta a ordem em 92% das músicas que aparecem nos três
      níveis. O ritmo ainda não entra na conta.</p>`));
    corpo.append(b);
  }

  if (info.mais_tocadas?.length) {
    const b = document.createElement("div");
    b.className = "bloco";
    b.innerHTML = `<h3>Notas mais tocadas</h3><div class="fichas"></div>`;
    comDica(b.querySelector("h3"), "As que mais aparecem na música. Costumam ser bons "
      + "pontos de apoio para começar e terminar frases.");
    info.mais_tocadas.forEach(([n, q]) => b.querySelector(".fichas").append(ficha(`${n} · ${q}×`)));
    corpo.append(b);
  }

  // Cifra lida e formacao do acorde sao o mesmo assunto: um cartao so, as fichas
  // para bater o olho e a lista logo abaixo para ver de que notas cada uma e feita.
  if (info.cifras?.length) {
    const b = document.createElement("div");
    b.className = "bloco";
    b.innerHTML = `<h3>Acordes da música</h3><div class="fichas"></div>
      <div class="escalas comgrau"></div>`;
    comDica(b.querySelector("h3"), "Os acordes que o arranjador escreveu acima da pauta, "
      + "lidos direto do arquivo. Em cada linha vêm o grau dentro do tom, as notas que "
      + "formam o acorde e a escala que cabe por cima dele. O grau é o que permite tocar "
      + "a mesma música em outro tom: ii-V-I é ii-V-I em qualquer lugar.");
    info.cifras.forEach(c => b.querySelector(".fichas").append(ficha(c)));
    for (const it of info.escalas || []) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="grau-ac"></span>`
                  + `<span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = it.cifra;
      l.querySelector(".grau-ac").textContent = it.grau || "";
      l.querySelector(".notas-ac").textContent = (it.notas || []).join(" ");
      l.querySelector(".esc").textContent = it.escala;
      b.querySelector(".escalas").append(l);
    }
    corpo.append(b);
  }

  // O que a harmonia esta FAZENDO — e o pulo do gato para improvisar: em vez de estudar
  // tres acordes separados, ver que os tres sao um ii-V-I e que uma escala cobre todos.
  if (info.cadencias?.length || info.blues) {
    const b = document.createElement("div");
    b.className = "bloco larga";
    b.innerHTML = `<h3>O que a harmonia está fazendo</h3>
      <p class="aviso-campo"></p><div class="escalas cadencias"></div>`;
    comDica(b.querySelector("h3"), trecho(`
      <p>Acorde não anda a esmo: ele puxa o seguinte. O caso mais comum é a fundamental
      subir uma quarta — <b>ii-V-I</b> — e é isso que está sendo procurado aqui, pelas
      distâncias entre as fundamentais, não pelo nome dos acordes. Por isso funciona em
      qualquer tom e mesmo quando a música muda de tom no meio.</p>
      <p>A coluna da direita é o que interessa na hora de tocar: <b>uma escala serve para o
      grupo inteiro</b>. Estudar Dm7, G7 e Cmaj7 separados é estudar três vezes a mesma
      coisa.</p>`));
    b.querySelector(".aviso-campo").textContent = info.blues
      || "Grupos de acordes que andam juntos, na ordem em que aparecem.";
    for (const c of info.cadencias || []) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = c.nome;
      l.querySelector(".notas-ac").textContent = c.acordes.join(" → ");
      l.querySelector(".esc").textContent = c.escala + ` · linha ${c.linha}`;
      b.querySelector(".cadencias").append(l);
    }
    corpo.append(b);
  }

  // A sequencia em GRAUS: e a musica sem o tom, que e como ela se guarda de cabeca
  if (info.funcional?.length > 1) {
    const b = document.createElement("div");
    b.className = "bloco larga";
    b.innerHTML = `<h3>A sequência em graus</h3><div class="graus"></div>`;
    comDica(b.querySelector("h3"), "A mesma progressão escrita em números romanos, sem o "
      + "tom. É assim que se decora uma música e se transporta na hora: o ouvido guarda "
      + "que o segundo acorde é o V, não que ele é Sol sete.");
    for (const it of info.funcional) {
      const g = document.createElement("span");
      g.className = "grau" + (it.dentro ? "" : " fora");
      g.innerHTML = `<b></b><i></i>`;
      g.querySelector("b").textContent = it.grau;
      g.querySelector("i").textContent = it.cifra;
      if (it.papel) g.title = it.papel;
      b.querySelector(".graus").append(g);
    }
    corpo.append(b);
  }

  if (info.campo?.length) {
    const b = document.createElement("div");
    b.className = "bloco";
    const semCifra = !info.cifras?.length;
    b.innerHTML = `<h3></h3>
      <p class="aviso-campo"></p><div class="escalas campo-tom"></div>`;
    b.querySelector("h3").textContent = `Campo harmônico de ${info.tom}`;
    comDica(b.querySelector("h3"), trecho(`
      <p>Os sete acordes que nascem do tom, empilhando terças sobre a escala. Formam o
      repertório que combina com a música, mesmo que ela não toque todos. Sem cifra na
      partitura, é daqui que você parte para improvisar.</p>
      <p>Vêm em <b>tétrades</b>, de quatro notas, e não em tríades. O motivo é prático: a
      sétima é justamente a nota que separa o Imaj7 do V7 — sem ela, o I e o V do tom têm o
      mesmo desenho e a mesma cara, e é a sétima que diz qual dos dois quer resolver no
      outro. Quem toca sozinho pode deixá-la de fora; quem improvisa, não.</p>
      <p>Na ponta direita vem o <b>modo</b> de cada grau: a escala do tom começando naquela
      nota. É o nome que os métodos usam (dórico, mixolídio) e serve como ponto de partida
      sobre aquele acorde.</p>`));
    b.querySelector(".aviso-campo").textContent = semCifra
      ? "A partitura veio sem cifra. Estes são os acordes que cabem no tom, como palpite."
      : "O que o tom comporta, para comparar com as cifras acima.";
    for (const g of info.campo) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = `${g.grau} · ${g.cifra}`;
      l.querySelector(".notas-ac").textContent = g.notas.join(" ");
      l.querySelector(".esc").textContent = g.modo || g.qualidade;
      l.title = `tríade ${g.triade} (${g.triade_qual}) · ${g.qualidade}`;
      b.querySelector(".campo-tom").append(l);
    }
    corpo.append(b);
  }

  if (info.real) {
    const reg = info.registro || {};
    const b = document.createElement("div");
    b.className = "bloco";
    b.innerHTML = `<h3>No sax alto</h3><div class="fichas"></div>
      <p class="aviso-campo"></p>`;
    comDica(b.querySelector("h3"), trecho(`
      <p>O alto é um instrumento em <b>Mi bemol</b>: o dó que você lê sai como o mi bemol
      de baixo, uma sexta maior abaixo. A armadura de concerto é a escrita menos três
      bemóis, e é dela que sai o tom que a banda usa.</p>
      <p>As contagens embaixo são de dedilhado, não de leitura: da chave de palma para cima
      a mão esquerda muda de posição, e o altíssimo passa do registro normal do
      instrumento.</p>`));
    const fs = b.querySelector(".fichas");
    fs.append(ficha(`soa em ${info.real.tom}`));
    fs.append(ficha(`${info.real.grave}–${info.real.agudo} de verdade`));
    if (reg.palma) fs.append(ficha(`${reg.palma} notas de chave de palma`));
    if (reg.altissimo) fs.append(ficha(`${reg.altissimo} no altíssimo`));
    if (reg.mesa) fs.append(ficha(`${reg.mesa} no grave de mindinho`));
    const fora = (info.fora_do_tom || []).map(([n, q]) => `${n} ${q}×`).join("  ·  ");
    b.querySelector(".aviso-campo").textContent = fora
      ? "Notas de fora do tom (é aqui que mora o cromatismo): " + fora
      : "A música fica inteira dentro do tom.";
    corpo.append(b);
  }

  return d;
}

async function processar(arquivos) {
  const todos = [...arquivos];
  if (!todos.length) return;

  // valida antes de qualquer download pesado. O TIPO e decidido aqui, na porta, e nao
  // por fracasso de leitura mais adiante: fallback silencioso faz um PDF ruim ser lido
  // como imagem e ninguem entende o motivo.
  const fila = [];
  for (const f of todos) {
    const cartao = criarCartao(f.name);
    const ehPdf = /\.pdf$/i.test(f.name) || f.type === "application/pdf";
    const ehImg = /\.(jpe?g|png|webp|bmp|tiff?|heic)$/i.test(f.name)
                  || (f.type || "").startsWith("image/");
    if (!ehPdf && !ehImg) {
      cartao.marcar("ruim", "não é PDF nem imagem");
    } else if (f.size > MAX_MB * 1024 * 1024) {
      cartao.marcar("ruim", `maior que ${MAX_MB} MB`);
    } else {
      fila.push({ f, cartao, imagem: !ehPdf });
    }
  }
  if (!fila.length) { progresso({ on: false }); return; }

  const py = await pegarPy();
  const sistema = document.querySelector('input[name=sistema]:checked').value;
  // so a ENTRADA em imagem precisa do opencv; saida em PNG e rasterizacao do PyMuPDF
  if (fila.some(x => x.imagem)) await prepararImagem(py);

  for (let i = 0; i < fila.length; i++) {
    const { f, cartao, imagem } = fila[i];
    progresso({ texto: `Lendo ${f.name}`, feito: i, total: fila.length });
    cartao.marcar("trabalhando", "lendo…");
    await new Promise(r => setTimeout(r, 20));
    try {
      const noFS = "/entrada_" + i + ".bin";
      py.FS.writeFile("/entrada.pdf", new Uint8Array(await f.arrayBuffer()));
      py.FS.writeFile(noFS, py.FS.readFile("/entrada.pdf"));
      py.globals.set("_sistema", sistema);
      py.globals.set("_titulo", f.name.replace(/\.[^.]+$/, ""));
      // sem opcao para escolher: sai no mesmo formato que entrou
      py.globals.set("_saida_fmt", imagem ? "imagem" : "pdf");
      const res = py.runPython(`
import json, anotar_partitura as A, analise, dificuldade as Dif, pymupdf
_dados = open("/entrada.pdf","rb").read()
# estampar=False: a previa sai LIMPA e os nomes vem na lista rel["rotulos"], para o
# editor desenhar por cima. O arquivo final so e gerado quando o usuario clica em baixar,
# ja com as edicoes dele. (Sem acento grave aqui dentro: isso vive numa template string
# do JS e um acento grave fecharia a string no meio do Python.)
_saida, _rel = A.anotar_bytes(_dados, sistema=_sistema,
                              saida=_saida_fmt, estampar=False)
_previa = b""
_info, _nota, _cifras = None, None, b""
if _rel["total"]:
    if _rel["formato"] == "png":
        _previa = _saida                      # a saida JA e a imagem: serve de previa
    else:
        _d = pymupdf.open(stream=_saida, filetype="pdf")
        _previa = _d[0].get_pixmap(dpi=96).tobytes("png")
        _d.close()
    # analise, tom, cifra e dificuldade dependem de span de TEXTO, que imagem nao tem
    if _rel["tem_analise"]:
        try:
            _info = analise.analisar(_dados)
        except Exception:
            _info = None
        if _info is not None:
            try:
                _info["melodia"] = A.melodia(_dados)
            except Exception:
                pass
            try:
                _info["acompanhamento"] = analise.acompanhamento(_dados, _info)
            except Exception:
                _info["acompanhamento"] = []
        try:
            _nota = Dif.nota("/entrada.pdf", json.load(open("/pesos_dificuldade.json")))[0]
        except Exception:
            _nota = None
# a folha de cifras sai AGORA, junto: e um PDF de texto, custa milissegundos, e assim o
# botao de baixar nao precisa guardar o dicionario da analise do lado do Python
if _info and _info.get("cifras"):
    try:
        _cifras = analise.folha_de_cifras(_info, _titulo) or b""
    except Exception:
        _cifras = b""
(_saida, _previa, json.dumps({"rel": _rel, "info": _info, "nota": _nota}), _cifras)
`);
      const [pdfOut, previaOut, extra, cifrasOut] = res.toJs({ create_proxies: false });
      res.destroy?.();
      concluir(cartao, f.name, previaOut, JSON.parse(extra),
               { py, noFS, sistema, cifras: cifrasOut });
    } catch (e) {
      falhar(cartao, f, e);
    }
  }
  progresso({ texto: "Pronto", feito: fila.length, total: fila.length });
  setTimeout(() => progresso({ on: false }), 1200);
}

          <button type="button" class="btn-mini" data-prox>›</button>
        </span>
        <button type="button" class="btn-mini esticar" data-undo disabled>Desfazer</button>
        <button type="button" class="btn-mini" data-lupa>Ampliar</button>
      </div>
      <div class="palco"></div>
      <div class="dica-editor">
        <span class="chip">num nome</span> corrige, ou apaga se esvaziar
        <span class="chip">no vazio</span> acrescenta um nome
      </div>
    </div>`;
  const palco = cx.querySelector(".palco");
  palco.tabIndex = -1;                    // recebe foco: e o que faz o Ctrl+Z chegar aqui
  const img = document.createElement("img");
  img.alt = "Página de " + ctx.nome;
  img.src = URL.createObjectURL(new Blob([ctx.previa], { type: "image/png" }));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${pg.largura} ${pg.altura}`);
  palco.append(img, svg);

  // so a 1a pagina e editavel (e a unica com previa); as outras seguem como foram lidas
  ctx.rotulos = ctx.rel.rotulos.map(r => ({ ...r }));
  ctx.pagina = 0;
  let sel = null, campo = null, paleta = null;
  // pilha de desfazer: uma copia da lista ANTES de cada mexida. Apagar sem querer e o
  // acidente mais provavel num editor de toque, e nao havia volta.
  const pilha = [];
  const guardar = () => {
    pilha.push(ctx.rotulos.map(r => ({ ...r })));
    if (pilha.length > 40) pilha.shift();
    if (btUndo) btUndo.disabled = false;
  };
  const desfazer = () => {
    if (!pilha.length) return;
    ctx.rotulos = pilha.pop();
    if (btUndo) btUndo.disabled = !pilha.length;
    fechar();
  };

  const NS = "http://www.w3.org/2000/svg";
  const redesenhar = () => {
    svg.textContent = "";
    ctx.rotulos.forEach((r, k) => {
      if (r.pagina !== ctx.pagina || !r.texto) return;
      const g = document.createElementNS(NS, "g");
      g.dataset.k = k;
      if (k === sel) g.classList.add("sel");
      // retangulo de toque, generoso: ~2,2x o corpo de altura e no minimo 2,4x de largura
      const larg = Math.max(2.4 * r.corpo, 0.62 * r.corpo * r.texto.length);
      const alvo = document.createElementNS(NS, "rect");
      alvo.setAttribute("class", "toque");
      alvo.setAttribute("x", (r.novo ? r.x : r.x0 + larg / 2) - larg / 2);
      alvo.setAttribute("y", r.y - 1.15 * r.corpo);
      alvo.setAttribute("width", larg);
      alvo.setAttribute("height", 1.7 * r.corpo);
      alvo.setAttribute("rx", 3);
      const el = document.createElementNS(NS, "text");
      if (r.novo) {                       // sem x0 vindo do Python: centra no x, como o PDF
        el.setAttribute("x", r.x);
        el.setAttribute("text-anchor", "middle");
      } else {
        el.setAttribute("x", r.x0);
      }
      el.setAttribute("y", r.y);
      el.setAttribute("font-size", r.corpo);
      el.textContent = r.texto;
      g.append(alvo, el);
      g.addEventListener("click", ev => { ev.stopPropagation(); abrir(k); });
      svg.append(g);
    });
  };

  const fechar = () => { campo?.remove(); paleta?.remove(); campo = paleta = null;
                         sel = null; redesenhar(); };

  const abrir = (k) => {
    campo?.remove(); paleta?.remove();
    sel = k;
    redesenhar();
    // posicao pela MATRIZ do proprio SVG, e nao pelo <text>: um rotulo recem-criado tem
    // texto vazio, entao nao ha elemento nenhum para medir
    const r = ctx.rotulos[k];
    const pt = svg.createSVGPoint();
    pt.x = r.x; pt.y = r.y;
    const tela = pt.matrixTransform(svg.getScreenCTM());
    const pr = palco.getBoundingClientRect();
    campo = document.createElement("input");
    campo.className = "campo";
    campo.value = r.texto;
    campo.style.left = Math.max(2, Math.min(pr.width - 86, tela.x - pr.left - 42)) + "px";
    campo.style.top = Math.min(pr.height - 30, tela.y - pr.top + 6) + "px";
    campo.title = "Enter aplica, vazio apaga, Esc cancela";
    const aplicar = () => {
      // remover um campo com foco dispara blur, que chama isto de novo: sem a guarda a
      // segunda passada acha `campo` nulo e estoura
      if (!campo) return;
      const novo = campo.value.trim();
      if (novo !== r.texto) { guardar(); ctx.rotulos[k].texto = novo; }
      fechar();
    };
    campo.addEventListener("keydown", ev => {
      if (ev.key === "Enter") aplicar();
      if (ev.key === "Escape") fechar();
      ev.stopPropagation();
    });
    campo.addEventListener("blur", aplicar);
    // PALETA: no celular digitar "F#" e pior que tocar num botao. Os chips usam
    // pointerdown + preventDefault para NAO roubar o foco do campo — se roubassem, o blur
    // aplicaria e fecharia antes do clique chegar.
    const nomes = ctx.sistema === "dore"
      ? ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"]
      : ["C", "D", "E", "F", "G", "A", "B"];
    paleta = document.createElement("div");
    paleta.className = "paleta";
    const chip = (txt, classe, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = txt;
      if (classe) b.className = classe;
      b.addEventListener("pointerdown", ev => { ev.preventDefault(); fn(); });
      paleta.append(b);
    };
    const base = () => campo.value.replace(/[#b]+$/, "");
    nomes.forEach(nm => chip(nm, "", () => {
      campo.value = nm + campo.value.slice(base().length);
      campo.focus();
    }));
    chip("♯", "acc", () => { campo.value = base() + "#"; campo.focus(); });
    chip("♭", "acc", () => { campo.value = base() + "b"; campo.focus(); });
    chip("natural", "acc", () => { campo.value = base(); campo.focus(); });
    chip("apagar", "zap", () => { campo.value = ""; aplicar(); });
    chip("ok", "", () => aplicar());
    palco.append(campo, paleta);
    // a paleta cabe embaixo do campo, ou vai para cima se nao houver espaco
    const abaixo = parseFloat(campo.style.top) + 34;
    const cabe = abaixo + 90 < pr.height;
    paleta.style.left = Math.max(2, Math.min(pr.width - 212,
                                             parseFloat(campo.style.left) - 56)) + "px";
    paleta.style.top = (cabe ? abaixo : Math.max(2, parseFloat(campo.style.top) - 96)) + "px";
    campo.focus(); campo.select();
  };

  // clique no vazio: acrescenta um nome ali. Converte o ponto da tela para PONTO da
  // pagina pela matriz do proprio SVG — sem conta de zoom na mao.
  svg.addEventListener("click", ev => {
    if (campo) { fechar(); return; }
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const corpo = ctx.rotulos.find(r => r.pagina === ctx.pagina)?.corpo || 8;
    guardar();
    ctx.rotulos.push({ pagina: ctx.pagina, x: p.x, y_base: p.y, y: p.y, corpo, texto: "",
                       novo: true });
    redesenhar();
    abrir(ctx.rotulos.length - 1);
  });

  const btUndo = cx.querySelector("[data-undo]");
  btUndo.addEventListener("click", desfazer);
  palco.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") { ev.preventDefault(); desfazer(); }
  });

  // PAGINAS: so a 1a tinha previa, e num PDF de 253 paginas isso deixa o editor inutil da
  // 2a em diante. A troca rasteriza a pagina pedida em Python (barato) e refiltra o overlay
  // — os rotulos de TODAS as paginas ja estao na lista desde a leitura.
  const total = ctx.rel.paginas.length;
  const cxPag = cx.querySelector("[data-pag]");
  const conta = cx.querySelector("[data-conta]");
  const btAnt = cx.querySelector("[data-ant]");
  const btProx = cx.querySelector("[data-prox]");
  const irPara = async (n) => {
    if (n < 0 || n >= total || n === ctx.pagina || !ctx.py) return;
    fechar();
    conta.textContent = "…";
    ctx.py.globals.set("_fs2", ctx.noFS);
    ctx.py.globals.set("_pg2", n);
    const res = ctx.py.runPython(
      "import anotar_partitura as A, json\n"
      + "_png, _m = A.previa_de(open(_fs2,'rb').read(), _pg2)\n"
      + "(_png, json.dumps(_m))");
    const [png, meta] = res.toJs({ create_proxies: false });
    res.destroy?.();
    const m = JSON.parse(meta);
    ctx.pagina = m.pagina;
    img.src = URL.createObjectURL(new Blob([png], { type: "image/png" }));
    svg.setAttribute("viewBox", `0 0 ${m.largura} ${m.altura}`);
    atualizarPag();
    redesenhar();
  };
  const atualizarPag = () => {
    const nesta = ctx.rotulos.filter(r => r.pagina === ctx.pagina && r.texto).length;
    conta.textContent = `${ctx.pagina + 1}/${total} · ${nesta} nomes`;
    btAnt.disabled = ctx.pagina === 0;
    btProx.disabled = ctx.pagina >= total - 1;
  };
  if (total > 1) {
    cxPag.hidden = false;
    atualizarPag();
    btAnt.addEventListener("click", () => irPara(ctx.pagina - 1));
    btProx.addEventListener("click", () => irPara(ctx.pagina + 1));
  }

  // AMPLIAR: move o proprio palco para um overlay em tela cheia e devolve no fim. Mover um
  // no no DOM preserva os listeners, entao o editor continua funcionando lá dentro — nada e
  // recriado nem duplicado.
  const btLupa = cx.querySelector("[data-lupa]");
  btLupa.addEventListener("click", () => {
    fechar();
    const lupa = document.createElement("div");
    lupa.className = "lupa";
    const sair = document.createElement("button");
    sair.type = "button";
    sair.className = "btn btn-secundario lupa-fechar";
    sair.textContent = "Fechar (Esc)";
    const volta = () => {
      cx.querySelector(".barra-previa").after(palco);
      lupa.remove(); sair.remove();
      document.removeEventListener("keydown", naTecla);
    };
    const naTecla = ev => { if (ev.key === "Escape") volta(); };
    lupa.append(palco);
    document.body.append(lupa, sair);
    sair.addEventListener("click", volta);
    document.addEventListener("keydown", naTecla);
  });

  redesenhar();
  cartao.raiz.append(cx);
  return ctx;
}

async function baixar(botao, ctx) {
  const antes = botao.textContent;
  botao.textContent = "gerando…";
  botao.disabled = true;
  try {
    ctx.py.globals.set("_rot", JSON.stringify(ctx.rotulos.filter(r => r.texto)));
    ctx.py.globals.set("_fs", ctx.noFS);
    ctx.py.globals.set("_fmt", ctx.rel.formato === "png" ? "imagem" : "pdf");
    const res = ctx.py.runPython(`
import json, anotar_partitura as A
_b, _r = A.estampar_bytes(open(_fs,"rb").read(), json.loads(_rot), saida=_fmt)
(_b, _r["total"])
`);
    const [bytes, quantos] = res.toJs({ create_proxies: false });
    res.destroy?.();
    const png = ctx.rel.formato === "png";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: png ? "image/png" : "application/pdf" }));
    a.download = ctx.base + "_notas." + (png ? "png" : "pdf");
    a.click();
    // revoga DEPOIS: revogar no mesmo tick pode abortar o download antes de comecar
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    botao.textContent = `${quantos} nomes · baixar de novo`;
  } catch (e) {
    botao.textContent = "erro ao gerar";
    console.error(e);
  } finally {
    botao.disabled = false;
    setTimeout(() => { if (botao.textContent.includes("baixar de novo")) botao.textContent = antes; }, 4000);
  }
}

function concluir(cartao, nome, previa, { rel, info, nota }, extra) {
  const base = nome.replace(/\.[^.]+$/, "");
  if (!rel.total) {
    cartao.marcar("ruim", rel.modo === "imagem"
      ? "não achei pauta: a partitura precisa estar grande na imagem"
      : "nenhuma nota encontrada =(");
    return;
  }
  const detalhe = [`${rel.total} notas anotadas`];
  if (rel.por_pagina.length > 1) detalhe.push(`${rel.por_pagina.length} páginas`);
  // imagem e um arquivo de UMA pagina: com PDF de varias, o resto nao cabe na saida
  if (rel.formato === "png" && rel.por_pagina.length > 1) detalhe.push("imagem só da 1ª página");
  cartao.marcar("bom", detalhe.join(" · "));

  if (nota != null) {
    const selo = document.createElement("span");
    selo.className = "selo";
    selo.title = "Dificuldade estimada no sax alto";
    selo.innerHTML = `<span class="n"></span><span class="u">/10</span>`;
    selo.querySelector(".n").textContent = nota.toFixed(1);
    cartao.topo.append(selo);
  }

  const png = rel.formato === "png";
  // O download e gerado no CLIQUE, nao agora: assim ele sempre carrega as edicoes feitas
  // no editor. E por isso e um botao, e nao um link com href pronto.
  const bt = document.createElement("button");
  bt.type = "button";
  bt.className = "btn btn-secundario";
  bt.textContent = png ? "Baixar imagem" : "Baixar PDF";
  cartao.topo.append(bt);

  // Folha de cifras: PDF proprio, so a harmonia. Ja veio pronto do Python, entao aqui e um
  // link de verdade — nada a gerar no clique, porque o editor nao mexe em cifra.
  if (extra.cifras?.length) {
    const a = document.createElement("a");
    a.className = "btn btn-secundario";
    a.href = URL.createObjectURL(new Blob([extra.cifras], { type: "application/pdf" }));
    a.download = base + "_cifras.pdf";
    a.textContent = "Baixar cifras";
    a.title = "Uma folha só com os acordes e os graus, para improvisar";
    cartao.topo.append(a);
  }

  // A previa vem ABERTA e ANTES da analise. Aberta porque o resultado e o que se quer
  // ver; antes porque a analise e comprida e empurraria a pagina anotada para longe.
  let ctx = null;
  if (previa?.length) {
    ctx = montarEditor(cartao, { ...extra, rel, previa, nome, base,
                                 sistema: extra.sistema });
    $("#lista").classList.add("largo");
  }
  bt.addEventListener("click", () => baixar(bt, ctx || { ...extra, rel, base,
                                                        rotulos: rel.rotulos }));

  // Resolucao no limite: a leitura degrada rapido abaixo de ~8 px por espaco de pauta
  // (medido: 6 px -> 44% das cabecas). Melhor dizer isso do que entregar um resultado ruim
  // em silencio e o usuario achar que o programa nao funciona.
  const ii = rel.imagem_info;
  if (ii && ii.esp_px && ii.esp_px < 8.5) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.innerHTML = `A partitura está <b>pequena nesta imagem</b> (${ii.esp_px} px por espaço `
                + `de pauta; o bom é 10 ou mais), então algumas notas podem ter escapado. `
                + `Se puder, mande um print com a partitura maior na tela.`;
    cartao.raiz.append(p);
  }

  // A partitura JA tem nomes proprios: o resultado sai com duas fileiras, uma em cima da
  // outra. O programa sempre soube disso (rel.existentes) mas nao dizia nada, e na previa
  // isso parece defeito do editor. Quem quiser so uma fileira apaga a minha no editor.
  if (rel.existentes) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.innerHTML = `Esta partitura já tem <b>${rel.existentes} nomes escritos</b>, então os `
                + `meus ficam por cima. Toque num nome meu e esvazie o campo para tirá-lo.`;
    cartao.raiz.append(p);
  }

  if (info) cartao.raiz.append(montarAnalise(info, nota));
  if (!rel.tem_analise) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.textContent = "Print não tem texto embutido, então dessa vez não dá para ler "
                  + "cifra, tom, escala nem calcular a dificuldade — só o nome das notas.";
    cartao.raiz.append(p);
  }

}

function falhar(cartao, f, e) {
  cartao.marcar("ruim", String(e?.message || e).split("\n").pop().slice(0, 140));
  const b = document.createElement("button");
  b.className = "btn btn-secundario";
  b.textContent = "Tentar de novo";
  b.onclick = () => { cartao.raiz.remove(); processar([f]); };
  cartao.topo.append(b);
}

// ---- eventos
zona.addEventListener("click", () => entrada.click());
entrada.addEventListener("change", () => {
  if (entrada.files.length) processar(entrada.files);
  entrada.value = "";
});
["dragenter", "dragover"].forEach(ev =>
  zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add("sobre"); }));
["dragleave", "drop"].forEach(ev =>
  zona.addEventListener(ev, () => zona.classList.remove("sobre")));
zona.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) processar(e.dataTransfer.files);
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());
</script>
