  fatos.className = "fatos larga";
  const DICAS = {
    "Tom": `A armadura diz em que tom a música está. Maior costuma soar mais aberto e
            menor mais fechado. A relativa deste é ${info.tom_relativo}.`
           + (info.tom_por === "cifra"
              ? " Aqui quem decidiu entre maior e menor foi a harmonia: qual acorde faz de"
                + " tônica e, principalmente, qual acorde fecha a música."
              : " Aqui quem decidiu entre maior e menor foi o peso das notas na melodia,"
                + " porque a partitura não trouxe cifra."),
    "Soa em": "O sax alto é um instrumento em Mi bemol: o que sai dele é uma sexta maior "
              + "mais grave do que está escrito. Este é o tom que o piano ouve — é o que "
              + "você diz para a banda quando alguém pergunta o tom da música.",
    "Compasso": "A fórmula não vem escrita em lugar nenhum do arquivo: ela sai da soma das "
                + "durações de cada compasso. A soma que mais aparece é a fórmula, porque "
                + "anacruse e compasso final são exceção legítima.",
    "Âmbito": "Da nota mais grave até a mais aguda, na altura escrita, que no sax alto é "
              + "diferente da que sai.",
    "Extensão": "A distância entre essas duas notas em semitons. Doze semitons dão uma oitava.",
    "Notas": "Quantas cabeças de nota o arquivo tem ao todo.",
    "Compassos": "Trechos entre uma barra vertical e a seguinte.",
    "Alteradas": "Quanto da música tem sustenido, bemol ou bequadro. Quanto maior essa "
                 + "fatia, mais cromática a peça, e cromatismo dá trabalho no dedilhado.",
  };
  const linhas = [
    ["Tom", info.tom, ""],
    ["Soa em", info.real?.tom || "—", ""],
    ["Compasso", info.ritmo?.formula || "—", ""],
    ["Âmbito", `${info.grave}–${info.agudo}`, ""],
    ["Extensão", info.extensao, "semitons"],
    ["Notas", info.n_notas, ""],
    ["Compassos", info.compassos, ""],
    ["Alteradas", Math.round(info.frac_alteradas * 100) + "%", ""],
  ];
  for (const [rot, val, unid] of linhas) {
    const w = document.createElement("div");
    w.className = "fato";
    comDica(w, DICAS[rot] || "");
    w.innerHTML = `<dt></dt><dd></dd>`;
    w.querySelector("dt").textContent = rot;
    w.querySelector("dd").textContent = val;
    if (unid) {
      const u = document.createElement("span");
      u.className = "unid";
      u.textContent = " " + unid;
      w.querySelector("dd").append(u);
    }
    fatos.append(w);
  }
  corpo.append(fatos);
  if (info.melodia?.notas?.length)
    corpo.append(montarTocador(info.melodia, info.acompanhamento, ctx));


  if (info.mais_tocadas?.length) {
    const b = document.createElement("div");
    b.className = "bloco acc-ciano";
    b.innerHTML = `<h3>Notas mais tocadas</h3><div class="fichas"></div>`;
    comDica(b.querySelector("h3"), "As que mais aparecem na música. Costumam ser bons "
      + "pontos de apoio para começar e terminar frases.");
    info.mais_tocadas.forEach(([n, q]) => b.querySelector(".fichas").append(ficha(`${n} · ${q}×`)));
    corpo.append(b);
  }

  // Cifra lida e formacao do acorde sao o mesmo assunto: um cartao so, as fichas
  // para bater o olho e a lista logo abaixo para ver de que notas cada uma e feita.
  if (info.cifras?.length) {
    const b = document.createElement("div");
    b.className = "bloco acc-azul";
    b.innerHTML = `<h3>Acordes da música</h3><div class="fichas"></div>
      <div class="escalas comgrau"></div>`;
    comDica(b.querySelector("h3"), "Os acordes que o arranjador escreveu acima da pauta, "
      + "lidos direto do arquivo. Em cada linha vêm o grau dentro do tom, as notas que "
      + "formam o acorde e a escala que cabe por cima dele. O grau é o que permite tocar "
      + "a mesma música em outro tom: ii-V-I é ii-V-I em qualquer lugar.");
    info.cifras.forEach(c => b.querySelector(".fichas").append(ficha(c)));
    for (const it of info.escalas || []) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="grau-ac"></span>`
                  + `<span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = it.cifra;
      l.querySelector(".grau-ac").textContent = it.grau || "";
      l.querySelector(".notas-ac").textContent = (it.notas || []).join(" ");
      l.querySelector(".esc").textContent = it.escala;
      b.querySelector(".escalas").append(l);
    }
    corpo.append(b);
  }

  // O que a harmonia esta FAZENDO — e o pulo do gato para improvisar: em vez de estudar
  // tres acordes separados, ver que os tres sao um ii-V-I e que uma escala cobre todos.
  if (info.cadencias?.length || info.blues) {
    const b = document.createElement("div");
    b.className = "bloco larga acc-rosa";
    b.innerHTML = `<h3>O que a harmonia está fazendo</h3>
      <p class="aviso-campo"></p><div class="escalas cadencias"></div>`;
    comDica(b.querySelector("h3"), trecho(`
      <p>Acorde não anda a esmo: ele puxa o seguinte. O caso mais comum é a fundamental
      subir uma quarta — <b>ii-V-I</b> — e é isso que está sendo procurado aqui, pelas
      distâncias entre as fundamentais, não pelo nome dos acordes. Por isso funciona em
      qualquer tom e mesmo quando a música muda de tom no meio.</p>
      <p>A coluna da direita é o que interessa na hora de tocar: <b>uma escala serve para o
      grupo inteiro</b>. Estudar Dm7, G7 e Cmaj7 separados é estudar três vezes a mesma
      coisa.</p>`));
    b.querySelector(".aviso-campo").textContent = info.blues
      || "Grupos de acordes que andam juntos, na ordem em que aparecem.";
    for (const c of info.cadencias || []) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = c.nome;
      l.querySelector(".notas-ac").textContent = c.acordes.join(" → ");
      l.querySelector(".esc").textContent = c.escala + ` · linha ${c.linha}`;
      b.querySelector(".cadencias").append(l);
    }
    corpo.append(b);
  }

  // A sequencia em GRAUS: e a musica sem o tom, que e como ela se guarda de cabeca
  if (info.funcional?.length > 1) {
    const b = document.createElement("div");
    b.className = "bloco larga acc-rosa";
    b.innerHTML = `<h3>A sequência em graus</h3><div class="graus"></div>`;
    comDica(b.querySelector("h3"), "A mesma progressão escrita em números romanos, sem o "
      + "tom. É assim que se decora uma música e se transporta na hora: o ouvido guarda "
      + "que o segundo acorde é o V, não que ele é Sol sete.");
    for (const it of info.funcional) {
      const g = document.createElement("span");
      g.className = "grau" + (it.dentro ? "" : " fora");
      g.innerHTML = `<b></b><i></i>`;
      g.querySelector("b").textContent = it.grau;
      g.querySelector("i").textContent = it.cifra;
      if (it.papel) g.title = it.papel;
      b.querySelector(".graus").append(g);
    }
    corpo.append(b);
  }

  if (info.campo?.length) {
    const b = document.createElement("div");
    b.className = "bloco acc-azul";
    const semCifra = !info.cifras?.length;
    b.innerHTML = `<h3></h3>
      <p class="aviso-campo"></p><div class="escalas campo-tom"></div>`;
    b.querySelector("h3").textContent = `Campo harmônico de ${info.tom}`;
    comDica(b.querySelector("h3"), trecho(`
      <p>Os sete acordes que nascem do tom, empilhando terças sobre a escala. Formam o
      repertório que combina com a música, mesmo que ela não toque todos. Sem cifra na
      partitura, é daqui que você parte para improvisar.</p>
      <p>Vêm em <b>tétrades</b>, de quatro notas, e não em tríades. O motivo é prático: a
      sétima é justamente a nota que separa o Imaj7 do V7 — sem ela, o I e o V do tom têm o
      mesmo desenho e a mesma cara, e é a sétima que diz qual dos dois quer resolver no
      outro. Quem toca sozinho pode deixá-la de fora; quem improvisa, não.</p>
      <p>Na ponta direita vem o <b>modo</b> de cada grau: a escala do tom começando naquela
      nota. É o nome que os métodos usam (dórico, mixolídio) e serve como ponto de partida
      sobre aquele acorde.</p>`));
    b.querySelector(".aviso-campo").textContent = semCifra
      ? "A partitura veio sem cifra. Estes são os acordes que cabem no tom, como palpite."
      : "O que o tom comporta, para comparar com as cifras acima.";
    for (const g of info.campo) {
      const l = document.createElement("div");
      l.innerHTML = `<b></b><span class="notas-ac"></span><span class="esc"></span>`;
      l.querySelector("b").textContent = `${g.grau} · ${g.cifra}`;
      l.querySelector(".notas-ac").textContent = g.notas.join(" ");
      l.querySelector(".esc").textContent = g.modo || g.qualidade;
      l.title = `tríade ${g.triade} (${g.triade_qual}) · ${g.qualidade}`;
      b.querySelector(".campo-tom").append(l);
    }
    corpo.append(b);
  }

  return d;
}

async function processar(arquivos) {
  const todos = [...arquivos];
  if (!todos.length) return;

  // valida antes de qualquer download pesado. O TIPO e decidido aqui, na porta, e nao
  // por fracasso de leitura mais adiante: fallback silencioso faz um PDF ruim ser lido
  // como imagem e ninguem entende o motivo.
  const fila = [];
  for (const f of todos) {
    const cartao = criarCartao(f.name);
    const ehPdf = /\.pdf$/i.test(f.name) || f.type === "application/pdf";
    const ehImg = /\.(jpe?g|png|webp|bmp|tiff?|heic)$/i.test(f.name)
                  || (f.type || "").startsWith("image/");
    if (!ehPdf && !ehImg) {
      cartao.marcar("ruim", "não é PDF nem imagem");
    } else if (f.size > MAX_MB * 1024 * 1024) {
      cartao.marcar("ruim", `maior que ${MAX_MB} MB`);
    } else {
      fila.push({ f, cartao, imagem: !ehPdf });
    }
  }
  if (!fila.length) { progresso({ on: false }); return; }

  const py = await pegarPy();
  const sistema = document.querySelector('input[name=sistema]:checked').value;
  // so a ENTRADA em imagem precisa do opencv; saida em PNG e rasterizacao do PyMuPDF
  if (fila.some(x => x.imagem)) await prepararImagem(py);

  for (let i = 0; i < fila.length; i++) {
    const { f, cartao, imagem } = fila[i];
    progresso({ texto: `Lendo ${f.name}`, feito: i, total: fila.length });
    cartao.marcar("trabalhando", "lendo…");
    await new Promise(r => setTimeout(r, 20));
    try {
      const noFS = "/entrada_" + i + ".bin";
      py.FS.writeFile("/entrada.pdf", new Uint8Array(await f.arrayBuffer()));
      py.FS.writeFile(noFS, py.FS.readFile("/entrada.pdf"));
      py.globals.set("_sistema", sistema);
      py.globals.set("_titulo", f.name.replace(/\.[^.]+$/, ""));
      // sem opcao para escolher: sai no mesmo formato que entrou
      py.globals.set("_saida_fmt", imagem ? "imagem" : "pdf");
      const res = py.runPython(`
import json, anotar_partitura as A, analise, pymupdf
_dados = open("/entrada.pdf","rb").read()
# estampar=False: a previa sai LIMPA e os nomes vem na lista rel["rotulos"], para o
# editor desenhar por cima. O arquivo final so e gerado quando o usuario clica em baixar,
# ja com as edicoes dele. (Sem acento grave aqui dentro: isso vive numa template string
# do JS e um acento grave fecharia a string no meio do Python.)
_saida, _rel = A.anotar_bytes(_dados, sistema=_sistema,
                              saida=_saida_fmt, estampar=False)
_previa = b""
_info, _cifras = None, b""
if _rel["total"]:
    if _rel["formato"] == "png":
        _previa = _saida                      # a saida JA e a imagem: serve de previa
    else:
        _d = pymupdf.open(stream=_saida, filetype="pdf")
        _previa = _d[0].get_pixmap(dpi=96).tobytes("png")
        _d.close()
    # analise, tom e cifra dependem de span de TEXTO, que imagem nao tem
    if _rel["tem_analise"]:
        try:
            _info = analise.analisar(_dados, sistema=_sistema)
        except Exception:
            _info = None
        if _info is not None:
            try:
                _info["melodia"] = A.melodia(_dados)
            except Exception:
                pass
            try:
                _info["acompanhamento"] = analise.acompanhamento(_dados, _info)
            except Exception:
                _info["acompanhamento"] = []
# a folha de cifras sai AGORA, junto: e um .docx (zip de XML), custa milissegundos, e
# assim o botao de baixar nao precisa guardar o dicionario da analise do lado do Python
if _info and _info.get("leitura"):
    try:
        _cifras = analise.folha_de_notas_docx(_info, _titulo) or b""
    except Exception:
        _cifras = b""
(_saida, _previa, json.dumps({"rel": _rel, "info": _info}), _cifras)
`);
      const [pdfOut, previaOut, extra, cifrasOut] = res.toJs({ create_proxies: false });
      res.destroy?.();
      concluir(cartao, f.name, previaOut, JSON.parse(extra),
               { py, noFS, sistema, cifras: cifrasOut });
    } catch (e) {
      falhar(cartao, f, e);
    }
  }
  // /entrada.pdf e temporario: o que o editor precisa e a copia por arquivo (noFS)
  try { py.FS.unlink("/entrada.pdf"); } catch (e) {}
  progresso({ texto: "Pronto", feito: fila.length, total: fila.length });
  setTimeout(() => progresso({ on: false }), 1200);
}

// ------------------------------------------------------------------- editor
// Os nomes nao estao na imagem: a previa e a pagina limpa e cada nome e um <text> de um
// SVG por cima, posicionado em PONTOS da pagina. O SVG cuida da escala sozinho.
function montarEditor(cartao, ctx) {
  const pg = ctx.rel.paginas[0] || { largura: 595, altura: 842 };
  const cx = document.createElement("details");
  cx.className = "analise";
  cx.open = true;
  cx.innerHTML = `<summary>Página anotada — toque num nome para corrigir</summary>
    <div class="corpo previa">
      <div class="barra-previa">
        <span class="paginacao" data-pag hidden>
          <button type="button" class="btn-mini" data-ant>‹</button>
          <span data-conta></span>
          <button type="button" class="btn-mini" data-prox>›</button>
        </span>
        <button type="button" class="btn-mini esticar" data-undo disabled>Desfazer</button>
        <button type="button" class="btn-mini" data-lupa>Ampliar</button>
      </div>
      <div class="palco"></div>
      <div class="dica-editor">
        <span class="chip">num nome</span> corrige, ou apaga se esvaziar
        <span class="chip">no vazio</span> acrescenta um nome
      </div>
    </div>`;
  const palco = cx.querySelector(".palco");
  palco.tabIndex = -1;                    // recebe foco: e o que faz o Ctrl+Z chegar aqui
  const img = document.createElement("img");
  img.alt = "Página de " + ctx.nome;
  // um blob por pagina visitada, sem revogar, e memoria que nunca volta: o URL anterior
  // morre antes de o novo nascer
  const trocarImg = (bytes) => {
    const antigo = img.src;
    img.src = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
    if (antigo.startsWith("blob:")) setTimeout(() => URL.revokeObjectURL(antigo), 1000);
  };
  trocarImg(ctx.previa);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${pg.largura} ${pg.altura}`);
  // camada SEPARADA para a barra de execucao — o porque esta no CSS de .seguidor
  const svgSeg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svgSeg.setAttribute("class", "seguidor");
  svgSeg.setAttribute("viewBox", `0 0 ${pg.largura} ${pg.altura}`);
  svgSeg.style.display = "none";
  const agulha = document.createElementNS("http://www.w3.org/2000/svg", "line");
  agulha.setAttribute("class", "agulha");
  svgSeg.append(agulha);
  palco.append(img, svg, svgSeg);
  let alturaPg = pg.altura;

  // so a 1a pagina e editavel (e a unica com previa); as outras seguem como foram lidas
  ctx.rotulos = ctx.rel.rotulos.map(r => ({ ...r }));
  ctx.pagina = 0;
  let sel = null, campo = null, paleta = null;
  // pilha de desfazer: uma copia da lista ANTES de cada mexida. Apagar sem querer e o
  // acidente mais provavel num editor de toque, e nao havia volta.
  const pilha = [];
  const guardar = () => {
    pilha.push(ctx.rotulos.map(r => ({ ...r })));
    if (pilha.length > 40) pilha.shift();
    if (btUndo) btUndo.disabled = false;
  };
  const desfazer = () => {
    if (!pilha.length) return;
    ctx.rotulos = pilha.pop();
    if (btUndo) btUndo.disabled = !pilha.length;
    fechar();
  };

  const NS = "http://www.w3.org/2000/svg";
  const redesenhar = () => {
    svg.textContent = "";
    ctx.rotulos.forEach((r, k) => {
      if (r.pagina !== ctx.pagina || !r.texto) return;
      const g = document.createElementNS(NS, "g");
      g.dataset.k = k;
      if (k === sel) g.classList.add("sel");
      // retangulo de toque, generoso: ~2,2x o corpo de altura e no minimo 2,4x de largura
      const larg = Math.max(2.4 * r.corpo, 0.62 * r.corpo * r.texto.length);
      const alvo = document.createElementNS(NS, "rect");
      alvo.setAttribute("class", "toque");
      alvo.setAttribute("x", (r.novo ? r.x : r.x0 + larg / 2) - larg / 2);
      alvo.setAttribute("y", r.y - 1.15 * r.corpo);
      alvo.setAttribute("width", larg);
      alvo.setAttribute("height", 1.7 * r.corpo);
      alvo.setAttribute("rx", 3);
      const el = document.createElementNS(NS, "text");
      if (r.novo) {                       // sem x0 vindo do Python: centra no x, como o PDF
        el.setAttribute("x", r.x);
        el.setAttribute("text-anchor", "middle");
      } else {
        el.setAttribute("x", r.x0);
      }
      el.setAttribute("y", r.y);
      el.setAttribute("font-size", r.corpo);
      el.textContent = r.texto;
      g.append(alvo, el);
      g.addEventListener("click", ev => { ev.stopPropagation(); abrir(k); });
      svg.append(g);
    });
  };

  const fechar = () => { campo?.remove(); paleta?.remove(); campo = paleta = null;
                         sel = null; redesenhar(); };

  const abrir = (k) => {
    campo?.remove(); paleta?.remove();
    sel = k;
    redesenhar();
    // posicao pela MATRIZ do proprio SVG, e nao pelo <text>: um rotulo recem-criado tem
    // texto vazio, entao nao ha elemento nenhum para medir
    const r = ctx.rotulos[k];
    const pt = svg.createSVGPoint();
    pt.x = r.x; pt.y = r.y;
    const tela = pt.matrixTransform(svg.getScreenCTM());
    const pr = palco.getBoundingClientRect();
    campo = document.createElement("input");
    campo.className = "campo";
    campo.value = r.texto;
    campo.style.left = Math.max(2, Math.min(pr.width - 86, tela.x - pr.left - 42)) + "px";
    campo.style.top = Math.min(pr.height - 30, tela.y - pr.top + 6) + "px";
    campo.title = "Enter aplica, vazio apaga, Esc cancela";
    const aplicar = () => {
      // remover um campo com foco dispara blur, que chama isto de novo: sem a guarda a
      // segunda passada acha `campo` nulo e estoura
      if (!campo) return;
      const novo = campo.value.trim();
      if (novo !== r.texto) { guardar(); ctx.rotulos[k].texto = novo; }
      fechar();
    };
    campo.addEventListener("keydown", ev => {
      if (ev.key === "Enter") aplicar();
      if (ev.key === "Escape") fechar();
      ev.stopPropagation();
    });
    campo.addEventListener("blur", aplicar);
    // PALETA: no celular digitar "F#" e pior que tocar num botao. Os chips usam
    // pointerdown + preventDefault para NAO roubar o foco do campo — se roubassem, o blur
    // aplicaria e fecharia antes do clique chegar.
    const nomes = ctx.sistema === "dore"
      ? ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"]
      : ["C", "D", "E", "F", "G", "A", "B"];
    paleta = document.createElement("div");
    paleta.className = "paleta";
    const chip = (txt, classe, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = txt;
      if (classe) b.className = classe;
      b.addEventListener("pointerdown", ev => { ev.preventDefault(); fn(); });
      paleta.append(b);
    };
    const base = () => campo.value.replace(/[#b]+$/, "");
    nomes.forEach(nm => chip(nm, "", () => {
      campo.value = nm + campo.value.slice(base().length);
      campo.focus();
    }));
    chip("♯", "acc", () => { campo.value = base() + "#"; campo.focus(); });
    chip("♭", "acc", () => { campo.value = base() + "b"; campo.focus(); });
    chip("natural", "acc", () => { campo.value = base(); campo.focus(); });
    chip("apagar", "zap", () => { campo.value = ""; aplicar(); });
    chip("ok", "", () => aplicar());
    palco.append(campo, paleta);
    // a paleta cabe embaixo do campo, ou vai para cima se nao houver espaco
    const abaixo = parseFloat(campo.style.top) + 34;
    const cabe = abaixo + 90 < pr.height;
    paleta.style.left = Math.max(2, Math.min(pr.width - 212,
                                             parseFloat(campo.style.left) - 56)) + "px";
    paleta.style.top = (cabe ? abaixo : Math.max(2, parseFloat(campo.style.top) - 96)) + "px";
    campo.focus(); campo.select();
  };

  // clique no vazio: acrescenta um nome ali. Converte o ponto da tela para PONTO da
  // pagina pela matriz do proprio SVG — sem conta de zoom na mao.
  svg.addEventListener("click", ev => {
    if (campo) { fechar(); return; }
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const corpo = ctx.rotulos.find(r => r.pagina === ctx.pagina)?.corpo || 8;
    guardar();
    ctx.rotulos.push({ pagina: ctx.pagina, x: p.x, y_base: p.y, y: p.y, corpo, texto: "",
                       novo: true });
    redesenhar();
    abrir(ctx.rotulos.length - 1);
  });

  const btUndo = cx.querySelector("[data-undo]");
  btUndo.addEventListener("click", desfazer);
  palco.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") { ev.preventDefault(); desfazer(); }
  });

  // PAGINAS: so a 1a tinha previa, e num PDF de 253 paginas isso deixa o editor inutil da
  // 2a em diante. A troca rasteriza a pagina pedida em Python (barato) e refiltra o overlay
  // — os rotulos de TODAS as paginas ja estao na lista desde a leitura.
  const total = ctx.rel.paginas.length;
  const cxPag = cx.querySelector("[data-pag]");
  const conta = cx.querySelector("[data-conta]");
  const btAnt = cx.querySelector("[data-ant]");
  const btProx = cx.querySelector("[data-prox]");
  const irPara = async (n) => {
    if (n < 0 || n >= total || n === ctx.pagina || !ctx.py) return;
    fechar();
    conta.textContent = "…";
    ctx.py.globals.set("_fs2", ctx.noFS);
    ctx.py.globals.set("_pg2", n);
    const res = ctx.py.runPython(
      "import anotar_partitura as A, json\n"
      + "_png, _m = A.previa_de(open(_fs2,'rb').read(), _pg2)\n"
      + "(_png, json.dumps(_m))");
    const [png, meta] = res.toJs({ create_proxies: false });
    res.destroy?.();
    const m = JSON.parse(meta);
    ctx.pagina = m.pagina;
    trocarImg(png);
    svg.setAttribute("viewBox", `0 0 ${m.largura} ${m.altura}`);
    svgSeg.setAttribute("viewBox", `0 0 ${m.largura} ${m.altura}`);
    alturaPg = m.altura;
    atualizarPag();
    redesenhar();
  };
  const atualizarPag = () => {
    const nesta = ctx.rotulos.filter(r => r.pagina === ctx.pagina && r.texto).length;
    conta.textContent = `${ctx.pagina + 1}/${total} · ${nesta} nomes`;
    btAnt.disabled = ctx.pagina === 0;
    btProx.disabled = ctx.pagina >= total - 1;
  };
  if (total > 1) {
    cxPag.hidden = false;
    atualizarPag();
    btAnt.addEventListener("click", () => irPara(ctx.pagina - 1));
    btProx.addEventListener("click", () => irPara(ctx.pagina + 1));
  }

  // ---- barra de execucao. O tocador manda a posicao ja resolvida (pagina, pauta e x em
  // PONTOS da pagina) e aqui so se desenha. Virar a pagina e assunto DAQUI: quem toca a
  // musica nao sabe que existe paginacao.
  // Rolar so na TROCA de pauta, nunca a cada quadro: rolagem continua briga com o dedo de
  // quem esta tentando olhar outro trecho. E nao rola nada se a pagina ja cabe na tela.
  const rolarAte = (y) => {
    const r = palco.getBoundingClientRect();
    if (!r.height) return;
    const caixa = palco.closest(".lupa");          // ampliado rola a si mesmo, nao a janela
    const janela = caixa ? caixa.clientHeight : window.innerHeight;
    if (r.height <= janela * 0.9) return;
    const desvio = r.top + (y / alturaPg) * r.height - janela * 0.34;
    (caixa || window).scrollBy({ top: desvio, behavior: "smooth" });
  };

  let virando = false, ultimaPauta = null;
  ctx.seguir = (p) => {
    if (!p) { svgSeg.style.display = "none"; ultimaPauta = null; return; }
    if (p.pg !== ctx.pagina) {
      // rasterizar a pagina custa uma fracao de segundo em Python: sem esta trava os
      // pedidos de 25 em 25 ms se empilhariam durante a virada
      if (!virando && ctx.py) {
        virando = true;
        Promise.resolve(irPara(p.pg)).finally(() => { virando = false; });
      }
      return;
    }
    svgSeg.style.display = "";
    const vao = Math.max(1, p.base - p.topo);
    agulha.setAttribute("x1", p.x);
    agulha.setAttribute("x2", p.x);
    // sobra em cima para a haste, e embaixo para a fileira de nomes
    agulha.setAttribute("y1", p.topo - 0.8 * vao);
    agulha.setAttribute("y2", p.base + 1.6 * vao);
    const qual = p.pg + ":" + p.sl;
    if (qual !== ultimaPauta) { ultimaPauta = qual; rolarAte((p.topo + p.base) / 2); }
  };

  // AMPLIAR: move o proprio palco para um overlay em tela cheia e devolve no fim. Mover um
  // no no DOM preserva os listeners, entao o editor continua funcionando lá dentro — nada e
  // recriado nem duplicado.
  const btLupa = cx.querySelector("[data-lupa]");
  btLupa.addEventListener("click", () => {
    fechar();
    const lupa = document.createElement("div");
    lupa.className = "lupa";
    const sair = document.createElement("button");
    sair.type = "button";
    sair.className = "btn btn-secundario lupa-fechar";
    sair.textContent = "Fechar (Esc)";
    const volta = () => {
      cx.querySelector(".barra-previa").after(palco);
      lupa.remove(); sair.remove();
      document.removeEventListener("keydown", naTecla);
    };
    const naTecla = ev => { if (ev.key === "Escape") volta(); };
    lupa.append(palco);
    document.body.append(lupa, sair);
    sair.addEventListener("click", volta);
    document.addEventListener("keydown", naTecla);
  });

  redesenhar();
  cartao.raiz.append(cx);
  return ctx;
}

async function baixar(botao, ctx) {
  const antes = botao.textContent;
  botao.textContent = "gerando…";
  botao.disabled = true;
  try {
    ctx.py.globals.set("_rot", JSON.stringify(ctx.rotulos.filter(r => r.texto)));
    ctx.py.globals.set("_fs", ctx.noFS);
    ctx.py.globals.set("_fmt", ctx.rel.formato === "png" ? "imagem" : "pdf");
    const res = ctx.py.runPython(`
import json, anotar_partitura as A
_b, _r = A.estampar_bytes(open(_fs,"rb").read(), json.loads(_rot), saida=_fmt)
(_b, _r["total"])
`);
    const [bytes, quantos] = res.toJs({ create_proxies: false });
    res.destroy?.();
    const png = ctx.rel.formato === "png";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: png ? "image/png" : "application/pdf" }));
    a.download = ctx.base + "_notas." + (png ? "png" : "pdf");
    a.click();
    // revoga DEPOIS: revogar no mesmo tick pode abortar o download antes de comecar
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    botao.textContent = `${quantos} nomes · baixar de novo`;
  } catch (e) {
    botao.textContent = "erro ao gerar";
    console.error(e);
  } finally {
    botao.disabled = false;
    setTimeout(() => { if (botao.textContent.includes("baixar de novo")) botao.textContent = antes; }, 4000);
  }
}

function concluir(cartao, nome, previa, { rel, info }, extra) {
  const base = nome.replace(/\.[^.]+$/, "");
  if (!rel.total) {
    cartao.marcar("ruim", rel.modo === "imagem"
      ? "não achei pauta: a partitura precisa estar grande na imagem"
      : "nenhuma nota encontrada =(");
    return;
  }
  const detalhe = [`${rel.total} notas anotadas`];
  if (rel.por_pagina.length > 1) detalhe.push(`${rel.por_pagina.length} páginas`);
  // imagem e um arquivo de UMA pagina: com PDF de varias, o resto nao cabe na saida
  if (rel.formato === "png" && rel.por_pagina.length > 1) detalhe.push("imagem só da 1ª página");
  cartao.marcar("bom", detalhe.join(" · "));

  const png = rel.formato === "png";
  // O download e gerado no CLIQUE, nao agora: assim ele sempre carrega as edicoes feitas
  // no editor. E por isso e um botao, e nao um link com href pronto.
  const bt = document.createElement("button");
  bt.type = "button";
  // primario: e o arquivo anotado que a pessoa veio buscar. O acento da pagina
  // e reservado para esta acao — em nenhum outro botao.
  bt.className = "btn btn-primario";
  bt.textContent = png ? "Baixar imagem" : "Baixar PDF";
  cartao.topo.append(bt);

  // Cifras: documento proprio, so os nomes das notas, espelhando o papel — uma pagina
  // por pagina da partitura, uma linha por linha dela. Sai em .docx para dar para
  // corrigir e escrever em cima. Ja veio pronto do Python, entao e um link de verdade:
  // o editor de nomes nao mexe nesta folha.
  if (extra.cifras?.length) {
    const a = document.createElement("a");
    a.className = "btn btn-secundario";
    a.href = URL.createObjectURL(new Blob([extra.cifras],
      { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
    // o blob morre com o cartao: sem isto, um arquivo por PDF processado fica preso na aba
    a.addEventListener("click", () => setTimeout(() => URL.revokeObjectURL(a.href), 60000),
                       { once: true });
    a.download = base + "_cifras.docx";
    a.textContent = "Cifras";
    a.title = "Documento do Word com o nome das notas por extenso — uma página por página da partitura, uma linha por linha dela, com |: e :| onde tem repetição. Dá para editar";
    cartao.topo.append(a);
  }

  // A previa vem ABERTA e ANTES da analise. Aberta porque o resultado e o que se quer
  // ver; antes porque a analise e comprida e empurraria a pagina anotada para longe.
  let ctx = null;
  if (previa?.length) {
    ctx = montarEditor(cartao, { ...extra, rel, previa, nome, base,
                                 sistema: extra.sistema });
    $("#lista").classList.add("largo");
  }
  bt.addEventListener("click", () => baixar(bt, ctx || { ...extra, rel, base,
                                                        rotulos: rel.rotulos }));

  // Resolucao no limite: a leitura degrada rapido abaixo de ~8 px por espaco de pauta
  // (medido: 6 px -> 44% das cabecas). Melhor dizer isso do que entregar um resultado ruim
  // em silencio e o usuario achar que o programa nao funciona.
  const ii = rel.imagem_info;
  if (ii && ii.esp_px && ii.esp_px < 8.5) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.innerHTML = `A partitura está <b>pequena nesta imagem</b> (${ii.esp_px} px por espaço `
                + `de pauta; o bom é 10 ou mais), então algumas notas podem ter escapado. `
                + `Se puder, mande um print com a partitura maior na tela.`;
    cartao.raiz.append(p);
  }

  // A partitura JA tem nomes proprios: o resultado sai com duas fileiras, uma em cima da
  // outra. O programa sempre soube disso (rel.existentes) mas nao dizia nada, e na previa
  // isso parece defeito do editor. Quem quiser so uma fileira apaga a minha no editor.
  if (rel.existentes) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.innerHTML = `Esta partitura já tem <b>${rel.existentes} nomes escritos</b>, então os `
                + `meus ficam por cima. Toque num nome meu e esvazie o campo para tirá-lo.`;
    cartao.raiz.append(p);
  }

  if (info) cartao.raiz.append(montarAnalise(info, ctx));
  if (!rel.tem_analise) {
    const p = document.createElement("p");
    p.className = "nota-rodape";
    p.textContent = "Print não tem texto embutido, então dessa vez não dá para ler "
                  + "cifra, tom nem escala — só o nome das notas.";
    cartao.raiz.append(p);
  }

}

function falhar(cartao, f, e) {
  cartao.marcar("ruim", String(e?.message || e).split("\n").pop().slice(0, 140));
  const b = document.createElement("button");
  b.className = "btn btn-secundario";
  b.textContent = "Tentar de novo";
  b.onclick = () => { cartao.raiz.remove(); processar([f]); };
  cartao.topo.append(b);
}

// ---- eventos
zona.addEventListener("click", () => entrada.click());
entrada.addEventListener("change", () => {
  if (entrada.files.length) processar(entrada.files);
  entrada.value = "";
});
["dragenter", "dragover"].forEach(ev =>
  zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add("sobre"); }));
["dragleave", "drop"].forEach(ev =>
  zona.addEventListener(ev, () => zona.classList.remove("sobre")));
zona.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) processar(e.dataTransfer.files);
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());
</script>
